<!DOCTYPE html>
<html lang="ja">
<head>
<title id="title"></title>
<style>
html
{
    height: 100%;
}

body
{
    height: calc(100% - 16px);
}

.container
{
    display: flex;
    height: calc(100% - 30px);
    width: 100%;
}

#editor
{
    width: calc(100% - 8px);
    height: calc(100% - 6px);
    resize: none;
    border: 1px solid black;
}

#preview
{
    width: calc(100% - 8px);
    height: calc(100% - 2px);
    resize: none;
    border: 1px solid black;
}

#left
{
    height: 100%;
}

#right
{
    height: calc(100% - 4px);
    border-left: 2px solid black;
    border-top: 2px solid black;
    border-bottom: 2px solid black;
}

button
{
    font-size: 15px;
    height: 30px;
    width: 160px;
    cursor: pointer;
}

#tools
{
    overflow: auto;
}
</style>
</head>
<body onload="loadURL()">
<button onclick="sideBar()" id="button">サイドバーを開く</button>
<div class="container">
    <div id="left" style="width: 100%;">
        <!--class="container"-->
        <textarea id="editor" oninput="saveData()" onchange="saveData()" spellcheck="false"></textarea>
        <iframe id="preview" srcdoc></iframe>
    </div>
    <div id="right" style="width: 0%; display: none;">
        <div id="tools">
            <button id="openBtn" onclick="loadApi()">開く</button>
            <br>
            <button id="saveBtn" onclick="saveFile()">保存</button>
            <br>
            <button id="overwriteBtn" onclick="overwriteSavedFile()">上書き</button>
            <br>
            <button id="trimLineBtn" onclick="trimLine(event)">空行削除</button>
            <br>
            <span id="statusMessage" style></span>
        </div>

        <div>
            <label for="autosave">自動保存</label>
            <input type="checkbox" id="autosave" checked="false" oninput="AUTOSAVE()">
        </div>

        <div>
            <label for="display">プレビュー表示</label>
            <input type="checkbox" id="display" checked="false" oninput="DISPLAY()">
        </div>
    </div>
</div>

<script src="https://E24028.github.io/javascript.js"></script>
<script>
'use strict';

let fileHandle = null;
let lastEditedTime = 0;

let editor = s('editor');
let preview = s('preview');
let statusMessage = s('statusMessage');
let openBtn = s('openBtn');
let saveBtn = s('saveBtn');
let overwriteBtn = s('overwriteBtn');
let trimLineBtn = s('trimLineBtn');
let title = s('title');
let checkbox = s('autosave');
let checkbox2 = s('display');
let left = s('left');
let right = s('right');
let button = s('button');

function setStatus(message, isError = false)
{
    statusMessage.textContent = message;
    statusMessage.style.color = (isError ? 'red' : 'green');
}

function setButtonsState(isLoading)
{
    openBtn.disabled = isLoading;
    saveBtn.disabled = isLoading;
    overwriteBtn.disabled = isLoading;
    trimLineBtn.disabled = isLoading;
}

function getNow()
{
    return new Date().getTime();
}

// ファイルを読み込む関数
async function loadApi()
{
    setButtonsState(true);
    setStatus('ファイルを読み込み中...');

    try
    {
        [fileHandle] = await window.showOpenFilePicker();
        let file = await fileHandle.getFile();
        let content = await file.text();
        editor.value = content;
        iframeUpdate();
        setStatus('ファイルを正常に読み込みました。', false);
        title.innerText = `${fileHandle.name} - URLパラメータ2.html`;

        setButtonsState(false);
    } catch (error) {
        setStatus('ファイルの読み込みに失敗しました。', true);
        console.error(error);

        setButtonsState(false);
    }
}

// 新規ファイルとして保存する関数
async function saveFile()
{
    setButtonsState(true);
    setStatus('ファイルを保存中...');

    try
    {
        fileHandle = await window.showSaveFilePicker();
        let writable = await fileHandle.createWritable();
        await writable.write(editor.value);
        await writable.close();
        setStatus('ファイルが正常に保存されました。', false);
        title.innerText = `${fileHandle.name} - URLパラメータ2.html`;

        setButtonsState(false);
    } catch (error) {
        setStatus('ファイルの保存に失敗しました。', true);
        console.error(error);

        setButtonsState(false);
    }
}

// 既存のファイルを上書き
async function overwriteSavedFile()
{
    // 自動保存モードでは 2 秒待機
    if (checkbox.checked && (getNow() - lastEditedTime) < 2000)
    {
        setTimeout(overwriteSavedFile, 800);
        return;
    }

    if (!fileHandle)
    {
        saveFile();
        return;
    }

    setButtonsState(true);
    setStatus('ファイルを上書きしています...');

    try
    {
        let writable = await fileHandle.createWritable();
        await writable.write(editor.value);
        await writable.close();
        setStatus('ファイルが正常に上書きされました！', false);

        setButtonsState(false);
    } catch (error) {
        setStatus('ファイルの上書き中にエラーが発生しました。', true);
        console.error(error);

        setButtonsState(false);
    }
}

function trimLine()
{
    editor.value = editor.value.replace(/\n[ ]+\n/g, '\n\n');
    saveData();
}

// iframeの内容を更新
function iframeUpdate()
{
    preview.srcdoc = editor.value;

    setParams2(['key', editor.value]);
}

function saveData()
{
    iframeUpdate();

    if (fileHandle)
    {
        if (autosave.checked)
        {
            setStatus('自動保存を待機しています...', false);

            lasteditedTime = getNow();

            setTimeout(overwriteSavedFile, 800);
        } else {
            setStatus('保存されていない変更があります。', true);
        }
    }
}

function loadURL()
{
    editor.value = getParams2('key');
    preview.srcdoc = getParams2('key');

    checkbox.checked = (getParams2('autoSave') === 'true');
    checkbox2.checked = (getParams2('display') === 'true');

    title.innerText = 'URLパラメータ2.html';

    if (getParams2('display') === 'true')
    {
        preview.style.display = '';
        editor.style.display = 'none';
    } else {
        preview.style.display = 'none';
        editor.style.display = '';
    }

    if (getParams2('sideBar') === 'open')
    {
        openSideBar();
    } else {
        closeSideBar();
    }
}

function sideBar()
{
    let leftWidth = returnLeft();
    let rightWidth = returnRight();

    if (rightWidth == 0)
    {
        openSideBar();
    } else {
        closeSideBar();
    }
}

function returnLeft()
{
    return Number(
        left.style.width.replace(/%/g, '')
    );
}

function returnRight()
{
    return Number(
        right.style.width.replace(/%/g, '')
    );
}

function openSideBar()
{
    let leftWidth = returnLeft();
    let rightWidth = returnRight();

    if (rightWidth !== 40)
    {
        leftWidth--;
        rightWidth++;

        left.style.width = leftWidth + '%';
        right.style.width = rightWidth + '%';

        setTimeout(openSideBar, 10);

        button.disabled = true;

        right.style.display = '';
    } else {
        button.disabled = false;
        button.innerText = 'サイドバーを閉じる';

        setParams2(['sideBar', 'open']);

        right.style.display = '';
    }
}

function closeSideBar()
{
    let leftWidth = returnLeft();
    let rightWidth = returnRight();

    if (rightWidth !== 0)
    {
        leftWidth++;
        rightWidth--;

        left.style.width = leftWidth + '%';
        right.style.width = rightWidth + '%';

        setTimeout(closeSideBar, 10);

        button.disabled = true;

        right.style.display = '';
    } else {
        button.disabled = false;
        button.innerText = 'サイドバーを開く';

        setParams2(['sideBar', 'close']);

        right.style.display = 'none';
    }
}

function AUTOSAVE()
{
    setParams2(['autoSave', checkbox.checked]);
    saveData();
}

function DISPLAY()
{
    setParams2(['display', checkbox2.checked]);

    if (checkbox2.checked)
    {
        preview.style.display = '';
        editor.style.display = 'none';
    } else {
        preview.style.display = 'none';
        editor.style.display = '';
    }
}
</script>
</body>
</html>
