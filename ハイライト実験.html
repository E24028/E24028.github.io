<!DOCTYPE html>
<html lang="ja">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<style>
html
{
    width: 100%;
    height: 100%;
}

body
{
    height: calc(100% - 16px);
    width: calc(100% - 16px);
    margin: 8px;
    overflow: auto;
}

.container
{
    display: flex;
    width: 100%;
    height: 100%;
}

.editor
{
    position: relative;
    width: 100%;
    height: 100%;
}

#editing, #highlighting
{
    width: calc(100% - 22px);
    height: calc(100% - 22px);
    font-family: monospace;
    font-size: 14px;
    margin: 0px;
    padding: 10px;
    border: 1px solid #cccccc;
    tab-size: 2; /* タブのサイズ */
}

#editing
{
    position: relative;
    z-index: 1;
    color: transparent;
    background: transparent; /* 文字を透明に */
    caret-color: black; /* カーソルだけ見せる */
    resize: none;
}

#highlighting
{
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none; /* クリックを透過 */
}

textarea, pre, code, span, script
{
    white-space: pre;
    line-height: 1.0;
    font-family: monospace;
}

#iFrame
{
    width: calc(100% - 2px);
    height: calc(100% - 2px);
    border: 1px solid black;
    zoom: 50%;
}

/* https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css より */

code[class*=language-], pre[class*=language-]
{
    color: #000;
    background: 0 0;
    text-shadow: 0px 1px #ffffff;
    /* font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace; */
    font-size: 1em;
    text-align: left;
    white-space: pre;
    word-spacing: normal;
    word-break: normal;
    word-wrap: normal;
    /* line-height: 1.5; */
    --moz-tab-size: 4;
    --o-tab-size: 4;
    tab-size: 4;
    --webkit-hyphens: none;
    --moz-hyphens: none;
    --ms-hyphens: none;
    hyphens: none;
}

code[class*=language-] ::-moz-selection, code[class*=language-]::-moz-selection, pre[class*=language-] ::-moz-selection, pre[class*=language-]::-moz-selection
{
    text-shadow: none;
    background: #b3d4fc;
}

code[class*=language-] ::selection, code[class*=language-]::selection, pre[class*=language-] ::selection, pre[class*=language-]::selection
{
    text-shadow: none;
    background: #b3d4fc;
}

@media print
{
    code[class*=language-], pre[class*=language-]
    {
        text-shadow: none;
    }
}

pre[class*=language-]
{
    padding: 1em;
    margin: 0.5em 0px;
    overflow: auto;
}

:not(pre) > code[class*=language-], pre[class*=language-]
{
    background: #f5f2f0;
}

:not(pre) > code[class*=language-]
{
    padding: 0.1em;
    border-radius: 0.3em;
    white-space: normal;
}

.token.cdata, .token.comment, .token.doctype, .token.prolog
{
    color: #708090;
}

.token.punctuation
{
    color: #999999;
}

.token.namespace
{
    opacity: 0.7;
}

.token.boolean, .token.constant, .token.deleted, .token.number, .token.property, .token.symbol, .token.tag
{
    color: #990055;
}

.token.attr-name, .token.builtin, .token.char, .token.inserted, .token.selector, .token.string
{
    color: #669900;
}

.language-css .token.string, .style .token.string, .token.entity, .token.operator, .token.url
{
    color: #9a6e3a;
    background: hsla(0, 0%, 100%, 50%);
}

.token.atrule, .token.attr-value, .token.keyword
{
    color: #0077aa;
}

.token.class-name, .token.function
{
    color: #dd4a68;
}

.token.important, .token.regex, .token.variable
{
    color: #ee9900;
}

.token.bold, .token.important
{
    font-weight: 700;
}

.token.italic
{
    font-style: italic;
}

.token.entity
{
    cursor: help;
}
</style>
</head>
<body onload="onLoad()">
<div class="container">
    <div class="editor">
        <!-- ハイライト表示用 -->
        <pre id="highlighting" aria-hidden="true"><code class="language-xml" id="highlighting-content"></code></pre>
        <!-- 入力用（背景色を透明に） -->
        <textarea id="editing" spellcheck="false" oninput="update()" onscroll="editorScroll()"></textarea>
    </div>
    <iframe id="iFrame"></iframe>
</div>
<script src="https://e24028.github.io/URL操作.js"></script>
<script>
let input = document.getElementById('editing');
let output = document.getElementById('highlighting-content');
let pre = document.getElementById('highlighting');
let iFrame = document.getElementById('iFrame');

function onLoad()
{
    let code = getParams('code') || '';
    input.value = code;
    output.textContent = code;
    iFrame.srcdoc = code;

    // Prism.jsでハイライトを適用
    Prism.highlightElement(output);
}

function update()
{
    output.textContent = input.value;
    iFrame.srcdoc = input.value;

    setParams(['code', input.value]);

    // Prism.jsでハイライトを再適用
    Prism.highlightElement(output);
}

function editorScroll()
{
    let x = input.scrollLeft;
    let y = input.scrollTop;
    pre.scrollLeft = x;
    pre.scrollTop = y;
}
</script>
</body>
</html>
