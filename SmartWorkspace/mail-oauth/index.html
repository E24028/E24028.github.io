<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Workspace - メールアドレス変更のOAuth認証</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" type="image/png" href="https://e24028.github.io/SmartWorkspace/favicon.png">
<style>
input[type="text"], input[type="password"]
{
    border: 1px solid #cbd5e1 !important;
    border-radius: 8px !important;
    padding: 8px 12px !important;
    font-family: monospace !important;
    font-size: 1.25rem !important;
    letter-spacing: 2px;
    text-align: center;
}

input[type="text"]:focus, input[type="password"]:focus
{
    border-color: #2563eb !important;
    outline: 2px solid rgba(37, 99, 235, 0.2) !important;
}

button
{
    border-radius: 8px !important;
    padding: 8px 16px !important;
}

::-webkit-scrollbar
{
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track
{
    background: transparent;
}

::-webkit-scrollbar-thumb
{
    background: rgba(156, 163, 175, 0.5);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover
{
    background: rgba(107, 114, 128, 0.7);
}

.material-icons-round
{
    user-select: none !important;
}

body
{
    overflow: auto !important;
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex items-center justify-center p-4" onload="onLoad()">

<div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
    <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <span class="material-icons-round text-3xl">vpn_key</span>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">認証コード入力</h2>
        <p class="text-sm text-slate-500 mt-1" id="infoText">新しいメールアドレスに送信されたコードを入力してください。</p>
        <p class="text-sm text-slate-500 mt-1">Ctrlキーで表示／非表示</p>
    </div>

    <div class="space-y-6 text-center">
        <div class="flex flex-col items-center gap-3">
            <form>
                <input type="password" onkeypress="toggleEnterKey(event)" id="oauth" name="oauth" class="w-full max-w-xs" placeholder="8桁のコード" maxlength="8" autocomplete="off">
            </form>
        </div>
        
        <div class="flex gap-3 justify-center">
            <button onclick="goToChangePage()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold border border-slate-200 transition-all">
                戻る
            </button>
            <button onclick="verifyPasskey()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-lg shadow-blue-500/20 transition-all">
                認証を完了
            </button>
        </div>
    </div>
</div>

<div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm"></div>

<script src="https://e24028.github.io/URL操作.js"></script>
<script>
function onLoad()
{
    // ログインチェック (未ログインなら強制リダイレクト)
    const savedUser = localStorage.getItem('chat_user');
    if (!savedUser)
    {
        setParams(['redirectTo', 'mail-oauth']);
        history.replaceState('', null, location.href.replace(/\/mail-oauth\//g, '/login/'));
        setTimeout((function() { location.reload(); }), 800);
        return;
    }

    getLastLogin('mail-oauth');

    const tempAddress = localStorage.getItem('email_change_temp_address');
    if (tempAddress)
    {
        document.getElementById('infoText').innerText = `${tempAddress} 宛てに送信されたコードを入力してください。`;
    }
}

function getLastLogin(redirectStr)
{
    // 制限時間（例: 7日間 = 7 × 24 × 3,600,000 ミリ秒）
    let EXPIRE_TIME = 7 * 24 * 3600000;

    // localStorage から最終ログイン日時（文字列）を取得
    let lastLoginStr = localStorage.getItem('workspace_lastLoginTime');
    let redirectTo = redirectStr || 'home';

    // データがない場合は未ログインとみなしてリダイレクト
    if (!lastLoginStr)
    {
        alert('セッションの有効期限が切れました。再度ログインしてください。');
        setParams(['redirectTo', redirectTo]);
        history.replaceState('', null, location.href.replaceAll(`/${redirectTo}/`, '/login/'));
        setTimeout((function() { location.reload(); }), 800);

        return;
    }

    // 数値（タイムスタンプ）に変換
    let lastLoginTime = parseInt(lastLoginStr, 10);
    let currentTime = Date.now(); // 現在のタイムスタンプ

    // 経過時間を計算し、制限時間を超えているか判定
    if (currentTime - lastLoginTime > EXPIRE_TIME)
    {
        alert('セッションの有効期限が切れました。再度ログインしてください。');

        // 必要に応じて古いデータをクリア
        localStorage.removeItem('workspace_lastLoginTime'); 

        // ログイン画面へリダイレクト
        setParams(['redirectTo', redirectTo]);
        history.replaceState('', null, location.href.replaceAll(`/${redirectTo}/`, '/login/'));
        setTimeout((function() { location.reload(); }), 800);
    }
}

async function verifyPasskey()
{
    const savedKey = localStorage.getItem('email_change_verification_key');
    const tempAddress = localStorage.getItem('email_change_temp_address');
    const inputKey = document.getElementById('oauth').value.trim();
    
    if (!savedKey || !tempAddress)
    {
        showToast('認証情報が切れているか、手続きが開始されていません。', 'error');
        return;
    }
    
    if (inputKey === savedKey)
    {
        // 認証成功：不要になった一時キーを削除
        localStorage.removeItem('email_change_verification_key');
        localStorage.removeItem('email_change_temp_address');
        
        // ログインユーザー情報のメールアドレスを上書き
        const savedUser = localStorage.getItem('chat_user');
        if (savedUser)
        {
            try
            {
                const user = JSON.parse(savedUser);
                user.email = tempAddress;
                localStorage.setItem('chat_user', JSON.stringify(user));
            } catch (e) {
                showToast(e, 'error');
            }
        }

        if (userName)
        {
            showToast('サーバーのデータを更新中...', 'info');
            const isSaved = await updateServerEmail(userName, tempAddress);
            if (!isSaved)
            {
                // 保存に失敗した場合でもメッセージを表示して中断処理が可能
                showToast('サーバーへの保存に失敗しました。再度お試しください。', 'error');
                toggleAPI();
                return;
            }
        }

        showToast('メールアドレスを変更しました！', 'success');

        // ホームにリダイレクト
        history.replaceState(
            '',
            null,
            `https://e24028.github.io/SmartWorkspace/${getParams('redirectTo') || 'home'}/?room=${getParams('room') || ''}&chatInput=${getParams('chatInput') || ''}&selectName=${getParams('selectName') || ''}`
        );
        setTimeout((function() { location.reload(); }), 800);

    } else {
        showToast('認証コードが一致しません。正しいコードを入力してください。', 'error');
    }
}

function goToChangePage()
{
    history.replaceState('', null, location.href.replace(/\/mail-oauth\//g, '/mail-change/'));
    setTimeout((function() { location.reload(); }), 800);
}

// チャットアプリ等と同一のAPI URLを定義
const API_URL = 'https://script.google.com/macros/s/AKfycbw9HNyXA1v8FhPQHQulED5OqrUTuiUTymUeKde_-H-0A4UPfTCtcHvm6Csvj6JqjVP7/exec?docId=13c310_cji5gSp30eX0-Kq2hCCSRdROdYjaveZhFYLDE';

async function updateServer(username, newEmail)
{
    try
    {
        // ① 最新データの取得
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('データ取得失敗');
        
        const data = await response.json();
        let parsedData = (data && data.text) ? JSON.parse(data.text) : (data || {});
        
        // データ構造の補正（rooms / users の展開）
        let rooms = parsedData.rooms || {};
        let users = parsedData.users || {};

        // ② ユーザーのメールアドレス情報を更新
        if (users[username])
        {
            // 既存データ (例: [email, notification, [0, 0]]) の1番目を差し替え
            users[username][0] = newEmail;
        } else {
            // 該当ユーザーが存在しない場合のフォールバック作成
            users[username] = [newEmail, true, [0, 0]];
        }

        // ③ 更新された全データをサーバーへPOST送信
        const payload = {
            rooms: rooms,
            users: users
        };

        const postBody = {
            text: JSON.stringify(payload, null, 2)
        };

        const saveResponse = await fetch(API_URL,
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: JSON.stringify(postBody)
            }
        );

        if (!saveResponse.ok)
        {
            throw new Error('サーバー保存失敗');
            return false;
        }

        return true;
    } catch (e) {
        console.error('サーバー同期エラー:', e);
        return false;
    }
}

function toggleEnterKey(event)
{
    if (event.ctrlKey)
    {
        let oauthInput = document.getElementById('oauth');
        oauthInput.type = (oauthInput.type === 'password') ? 'text' : 'password';
    }

    if (event.key === 'Enter' || event.keyCode === 13)
    {
        event.preventDefault();
        verifyPasskey();
    }
}

function toggleAPI()
{
    if (confirm('APIを「予備」に切り替えますか？'))
    {
        API_URL = 'https://script.google.com/macros/s/AKfycbzp8i6HxGNMibzkK4LH15gEmnvmYWjM2dvCZZin2UXVPBcGw8QGOU91xQZifr4Ea39S/exec?docId=13c310_cji5gSp30eX0-Kq2hCCSRdROdYjaveZhFYLDE';
    }
}

function showToast(message, type = 'info')
{
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    let bgClass = 'bg-blue-600 text-white';
    let icon = 'info_outline';

    if (type === 'success')
    {
        bgClass = 'bg-emerald-600 text-white';
        icon = 'check_circle_outline';
        console.log(message || 'log');
    } else if (type === 'error') {
        bgClass = 'bg-red-600 text-white';
        icon = 'error_outline';
        console.error(message || 'log');
    }

    toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-lg text-sm pointer-events-auto transition-all ${bgClass}`;
    toast.innerHTML = `<span class="material-icons-round text-lg shrink-0">${icon}</span><span class="font-medium">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}
</script>
</body>
</html>
