<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Workspace - オフライン</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" type="image/png" href="https://e24028.github.io/SmartWorkspace/favicon.png">
<link rel="manifest" href="/SmartWorkspace/manifest.json">
<style>
::-webkit-scrollbar
{
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track
{
    background: transparent;
}

::-webkit-scrollbar-thumb
{
    background: rgba(156, 163, 175, 0.5);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover
{
    background: rgba(107, 114, 128, 0.7);
}

.material-icons-round
{
    user-select: none !important;
}

body
{
    overflow: auto !important;
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden" onload="onLoad()">

<div class="flex flex-1 overflow-hidden relative">
    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-y-auto">
        <!-- オフライン表示 -->
        <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between shrink-0 sticky top-0 z-30">
            <div class="flex items-center space-x-3 min-w-0">
                <div class="w-9 h-9 bg-slate-700 rounded-lg flex items-center justify-center text-white shrink-0">
                    <span class="material-icons-round">wifi_off</span>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-slate-800 text-lg truncate" id="headerTitle">オフラインです</h1>
                    <p class="text-xs text-slate-400 truncate">ネットワーク接続を確認してください</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="location.reload()" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 transition-all flex items-center space-x-1" title="再読み込み">
                    <span class="material-icons-round text-lg">refresh</span>
                    <span class="text-xs font-semibold hidden md:inline">再試行</span>
                </button>
            </div>
        </header>

        <!-- メイン画面コンテンツ：リロードボタン -->
        <div class="p-6 max-w-4xl w-full mx-auto flex-1 flex flex-col justify-center items-center">
            <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center max-w-md w-full space-y-6">
                <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto">
                    <span class="material-icons-round text-3xl">cloud_off</span>
                </div>

                <div class="space-y-2">
                    <h2 class="text-xl font-bold text-slate-800">インターネットに接続されていません</h2>
                    <p class="text-sm text-slate-500 leading-relaxed">
                        現在オフライン状態のため、ページを表示できません。<br>
                        接続状態を確認のうえ、再度お試しいただくかホーム画面へお戻りください。
                    </p>
                </div>

                <div class="pt-2">
                    <button onclick="onLoad()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition-all shadow-md shadow-blue-500/10 flex items-center justify-center space-x-2">
                        <span class="material-icons-round text-lg">home</span>
                        <span>ホームへ戻る</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- javascript.js の読み込み -->
<script src="https://e24028.github.io/javascript.js"></script>
<script>
function onLoad()
{
    if (typeof setParams === 'function')
    {
        history.replaceState('', null, 'https://e24028.github.io/SmartWorkspace/home/');

        setTimeout(
            () => {
                location.reload();
            }, 800
        );
    }
}

if ('serviceWorker' in navigator)
{
    window.addEventListener('load',
        () => {
            navigator.serviceWorker.register('/SmartWorkspace/service-worker.js').then(
                (reg) => console.log('Service Worker 登録成功:', reg.scope)
            ).catch(
                (err) => console.error('Service Worker 登録失敗:', err)
            );
        }
    );
}
</script>
</body>
</html>
