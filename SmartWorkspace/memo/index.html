<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Workspace - メモ帳</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" type="image/png" href="https://e24028.github.io/SmartWorkspace/favicon.png">
<link rel="manifest" href="/SmartWorkspace/manifest.json">
<style>
::-webkit-scrollbar
{
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track
{
    background: transparent;
}

::-webkit-scrollbar-thumb
{
    background: rgba(156, 163, 175, 0.5);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover
{
    background: rgba(107, 114, 128, 0.7);
}

.material-icons-round
{
    user-select: none !important;
}

a.outerURL
{
    text-decoration: underline !important;
}

body
{
    overflow: auto !important;
}

@keyframes pulse-slow
{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.animate-pulse-slow
{
    animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden" onload="onLoad()">

<div class="flex flex-1 overflow-hidden relative">
    <!-- サイドバー -->
    <aside id="sidebar" class="w-80 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 transition-all duration-300 md:relative absolute z-40 h-full -translate-x-full md:translate-x-0">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                    <span class="material-icons-round">description</span>
                </div>
                <span class="font-bold text-white text-lg tracking-wide">
                    <a style="text-decoration: underline; cursor: pointer;" onclick="redirectHome()">Smart Workspace</a>
                </span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white">
                <span class="material-icons-round">close</span>
            </button>
        </div>

        <div class="p-4 bg-slate-950/40 border-b border-slate-800/80 flex flex-col">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden cursor-pointer" onclick="viewMyPage()">
                    <div class="w-8 h-8 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0" id="userAvatar">U</div>
                    <div class="truncate">
                        <p class="text-sm font-semibold text-white truncate" id="currentUsername">ユーザー</p>
                        <p class="text-xs text-slate-400 truncate" id="currentUserEmail">未登録</p>
                    </div>
                </div>
                <button onclick="logout()" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-red-400 transition-all" title="ログアウト">
                    <span class="material-icons-round text-lg">logout</span>
                </button>
            </div>
        </div>

        <div class="p-3 border-b border-slate-800/60">
            <button onclick="createNewMemo()" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition-all flex items-center justify-center space-x-2">
                <span class="material-icons-round text-lg">add_circle</span>
                <span>新規メモ作成</span>
            </button>
        </div>

        <div class="px-4 pt-4 pb-2 flex items-center justify-between text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <span>メモ一覧</span>
            <span class="text-xxs px-2 py-0.5 bg-slate-800 rounded-full text-slate-400" id="memoCount">0</span>
        </div>

        <div class="flex-1 overflow-y-auto px-2 space-y-1" id="memoList">
            <div class="text-center p-4 text-slate-500 text-sm">メモを読み込み中...</div>
        </div>

        <div class="p-3 bg-slate-950/20 border-t border-slate-800/60 text-xs text-slate-500 flex items-center justify-between">
            <span class="flex items-center gap-1">
                <span id="syncIndicator" class="inline-block w-2 h-2 rounded-full bg-slate-600"></span>
                <span id="syncText">未接続</span>
            </span>
            <button onclick="fetchData()" class="hover:text-slate-300 flex items-center gap-0.5">
                <span class="material-icons-round text-xs" id="refreshSpinner">sync</span>
                <span>再読込</span>
            </button>
        </div>
    </aside>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-y-auto">
        <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between shrink-0 sticky top-0 z-30">
            <div class="flex items-center space-x-3 min-w-0">
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-500 hover:bg-slate-100 rounded-lg">
                    <span class="material-icons-round">menu</span>
                </button>
                <div class="min-w-0">
                    <h1 class="font-bold text-slate-800 text-lg truncate" id="headerTitle">メモを選択してください</h1>
                    <p class="text-xs text-slate-400 truncate">
                        <span>作成者：</span>
                        <a style="text-decoration: underline; cursor: pointer;" onclick="viewUserPage()" id="headerSub" title="ユーザーページに移動">---</a>
                    </p>
                </div>
            </div>

            <div class="flex items-center space-x-2" id="actionButtons">
                <!-- AIアシスタントボタン -->
                <button onclick="openAIModal()" id="btnAIAssistant" class="p-2 hover:bg-purple-50 rounded-xl text-purple-600 hover:text-purple-700 transition-all flex items-center space-x-1 border border-purple-200 bg-purple-50/50" title="AIアシスタント">
                    <span class="material-icons-round text-lg">auto_awesome</span>
                    <span class="text-xs font-semibold hidden md:inline">AI校正機能</span>
                </button>
                <!-- インポートボタン -->
                <button onclick="openImportModal()" id="btnImportMemo" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 hover:text-emerald-600 transition-all flex items-center space-x-1" title="インポート">
                    <span class="material-icons-round text-lg">move_to_inbox</span>
                    <span class="text-xs font-semibold hidden md:inline">インポート</span>
                </button>
                <button onclick="exportText()" id="btnTextEditor" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 hover:text-indigo-600 transition-all flex items-center space-x-1" title="テキストエディター2で開く">
                    <span class="material-icons-round text-lg">open_in_new</span>
                    <span class="text-xs font-semibold hidden md:inline">エクスポート</span>
                </button>
                <button onclick="openAccessModal()" id="btnAccessConfig" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 hover:text-blue-600 transition-all flex items-center space-x-1" title="権限設定">
                    <span class="material-icons-round text-lg">lock</span>
                    <span class="text-xs font-semibold hidden md:inline">権限設定</span>
                </button>
                <label for="autoSaveToggle" class="px-3 py-4 hover:bg-slate-100 rounded-xl text-slate-600 hover:text-blue-600 transition-all flex items-center space-x-1" style="cursor: pointer;" title="10秒間操作がない場合に自動で保存します">
                    <input type="checkbox" id="autoSaveToggle" onchange="toggleAutoSaveOption()" checked class="w-3.5 h-3.5 accent-blue-600 rounded cursor-pointer">
                    <span class="text-xs font-semibold hidden md:inline">自動保存</span>
                </label>
                <button onclick="saveCurrentMemo()" id="btnSaveMemo" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition-all shadow-md shadow-blue-500/10 flex items-center space-x-1">
                    <span class="material-icons-round text-sm">save</span>
                    <span class="text-xs font-semibold hidden md:inline">保存</span>
                </button>
                <button onclick="deleteCurrentMemo()" id="btnDeleteMemo" class="p-2 hover:bg-red-50 rounded-xl text-slate-600 hover:text-red-600 transition-all flex items-center space-x-1" title="削除">
                    <span class="material-icons-round text-lg">delete</span>
                    <span class="text-xs font-semibold hidden md:inline">削除</span>
                </button>
            </div>
        </header>

        <div class="p-6 max-w-4xl w-full mx-auto flex-1 flex flex-col space-y-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col space-y-4">
                <!-- 簡易AIアクションバー -->
                <div class="flex items-center gap-2 overflow-x-auto py-1 border-b border-slate-100 text-xs">
                    <span class="text-slate-400 font-semibold flex items-center gap-1 text-xxs uppercase tracking-wider shrink-0">
                        <span class="material-icons-round text-sm text-purple-500">psychology</span>
                        <span>AIツール：</span>
                    </span>
                    <button onclick="quickAISummarize()" class="px-2.5 py-1 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg font-medium transition-all flex items-center gap-1 shrink-0">
                        <span class="material-icons-round text-xs">summarize</span>
                        <span>要約</span>
                    </button>
                    <button onclick="quickAIFixGrammar()" class="px-2.5 py-1 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg font-medium transition-all flex items-center gap-1 shrink-0">
                        <span class="material-icons-round text-xs">spellcheck</span>
                        <span>校正・整形</span>
                    </button>
                    <button onclick="quickAIGenerateTitle()" class="px-2.5 py-1 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg font-medium transition-all flex items-center gap-1 shrink-0">
                        <span class="material-icons-round text-xs">title</span>
                        <span>タイトル生成</span>
                    </button>
                </div>

                <div class="flex items-center justify-between gap-4">
                    <div class="flex-1">
                        <label class="text-xs font-semibold text-slate-500 block mb-1">タイトル</label>
                        <input type="text" id="memoTitleInput" oninput="onMemoEdit()" placeholder="メモのタイトル" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-base font-bold focus:outline-none focus:border-blue-500 transition-all">
                    </div>
                </div>

                <div class="flex-1 flex flex-col">
                    <label class="text-xs font-semibold text-slate-500 block mb-1">本文</label>
                    <textarea id="memoTextInput" oninput="onMemoEdit()" placeholder="本文を入力してください..." class="w-full flex-1 bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all resize-none min-h-[300px] leading-relaxed"></textarea>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- AIアシスタント モーダル -->
<div id="aiModal" class="fixed inset-0 bg-slate-900/55 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-xl w-full p-6 border border-slate-100 space-y-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3 shrink-0">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span class="material-icons-round text-purple-600">auto_awesome</span>
                <span>AI ワークスペースアシスタント</span>
            </h3>
            <button onclick="closeAIModal()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600">
                <span class="material-icons-round">close</span>
            </button>
        </div>

        <div class="space-y-4 overflow-y-auto flex-1 pr-1">
            <!-- プリセットコマンド選択 -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">クイックアクション</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setAIPromptPreset('summarize')" class="p-2.5 border border-purple-100 bg-purple-50/40 hover:bg-purple-100/60 rounded-xl text-left text-xs font-semibold text-purple-800 flex items-center gap-2 transition-all">
                        <span class="material-icons-round text-purple-600">format_list_bulleted</span>
                        <span>要約を作成</span>
                    </button>
                    <button onclick="setAIPromptPreset('proofread')" class="p-2.5 border border-purple-100 bg-purple-50/40 hover:bg-purple-100/60 rounded-xl text-left text-xs font-semibold text-purple-800 flex items-center gap-2 transition-all">
                        <span class="material-icons-round text-purple-600">auto_fix_high</span>
                        <span>文章の校正・推敲</span>
                    </button>
                    <button onclick="setAIPromptPreset('expand')" class="p-2.5 border border-purple-100 bg-purple-50/40 hover:bg-purple-100/60 rounded-xl text-left text-xs font-semibold text-purple-800 flex items-center gap-2 transition-all">
                        <span class="material-icons-round text-purple-600">post_add</span>
                        <span>内容を加筆・拡張</span>
                    </button>
                    <button onclick="setAIPromptPreset('translate')" class="p-2.5 border border-purple-100 bg-purple-50/40 hover:bg-purple-100/60 rounded-xl text-left text-xs font-semibold text-purple-800 flex items-center gap-2 transition-all">
                        <span class="material-icons-round text-purple-600">translate</span>
                        <span>英語へ翻訳</span>
                    </button>
                </div>
            </div>

            <!-- システムプロンプト設定 -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">AIの役割</label>
                <input type="text" id="aiSystemInput" value="あなたは優秀で親切な文章校正アシスタントです。ユーザーの要望に正確に応じて回答してください。" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500 transition-all">
            </div>

            <!-- カスタムプロンプト入力 -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">AIへの指示</label>
                <textarea id="aiPromptInput" placeholder="例: 以下のテキストを箇条書きで分かりやすく整理してください。" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-purple-500 transition-all resize-none h-20 leading-relaxed"></textarea>
            </div>

            <!-- AI応答プレビュー領域 -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-semibold text-slate-500">生成結果プレビュー</label>
                    <span id="aiLoadingIndicator" class="text-xs text-purple-600 font-semibold items-center gap-1 hidden">
                        <span class="material-icons-round text-sm animate-spin">sync</span>
                        <span>AIが思考中...</span>
                    </span>
                </div>
                <textarea id="aiResultPreview" readonly placeholder="AIによる実行結果がここに表示されます..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono h-36 focus:outline-none resize-none leading-relaxed text-slate-700"></textarea>
            </div>

            <!-- 適用オプション -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">反映方法</label>
                <select id="aiApplyModeSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-purple-500">
                    <option value="replace">本文全体を置換 (上書き)</option>
                    <option value="append" selected>現在の本文の末尾に追加</option>
                    <option value="new">新しいメモとして作成</option>
                </select>
            </div>
        </div>

        <div class="flex justify-between border-t border-slate-100 pt-3 shrink-0">
            <button onclick="runAIGenerate()" id="btnRunAI" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl text-xs transition-all flex items-center space-x-1 shadow-md shadow-purple-500/10">
                <span class="material-icons-round text-sm">auto_awesome</span>
                <span>生成開始！</span>
            </button>
            <div class="flex space-x-2">
                <button onclick="closeAIModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-all">キャンセル</button>
                <button onclick="applyAIResult()" id="btnApplyAI" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition-all flex items-center space-x-1 shadow-md shadow-emerald-500/10">
                    <span class="material-icons-round text-sm">check</span>
                    <span>メモに反映</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- アクセス権限設定モータル -->
<div id="accessModal" class="fixed inset-0 bg-slate-900/55 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 border border-slate-100 space-y-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3 shrink-0">
            <h3 class="text-lg font-bold text-slate-800">アクセス権限設定</h3>
            <button onclick="closeAccessModal(false)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600">
                <span class="material-icons-round">close</span>
            </button>
        </div>

        <div class="space-y-4 overflow-y-auto flex-1 pr-1">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">基本アクセス権限</label>
                <select id="basicAccessSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-blue-500">
                    <option value="un-published">非公開</option>
                    <option value="read-only" selected>閲覧のみ</option>
                    <option value="edit">編集可能</option>
                </select>
            </div>

            <div class="space-y-2 border-t border-slate-100 pt-3">
                <label class="block text-xs font-semibold text-slate-500">個別アクセス権限</label>
                <div id="personalAccessList" class="space-y-1.5 pt-1 max-h-36 overflow-y-auto"></div>
                <div id="addPersonalAccessForm" class="flex space-x-2">
                    <select id="targetUsernameInput" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-blue-500">
                        <option value="" selected>ユーザーを選択...</option>
                    </select>
                    <select id="personalAccessSelect" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-blue-500">
                        <option value="un-published">非公開</option>
                        <option value="read-only">閲覧のみ</option>
                        <option value="edit" selected>編集可能</option>
                    </select>
                    <button onclick="addPersonalAccessRule()" id="btnAddPersonalAccess" class="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl text-xs transition-all flex items-center shrink-0">
                        <span class="material-icons-round text-sm">add</span>
                        <span class="text-xs font-semibold hidden md:inline">追加</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center border-t border-slate-100 pt-3 shrink-0">
            <span id="accessModalWarning" class="text-xs text-red-500 font-semibold hidden">※ 権限変更の権限がありません</span>
            <div class="flex space-x-2 ml-auto">
                <button onclick="closeAccessModal(false)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-all">閉じる</button>
                <button onclick="closeAccessModal(true)" id="btnSaveAccess" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition-all">保存して閉じる</button>
            </div>
        </div>
    </div>
</div>

<!-- テキストインポート用モータル -->
<div id="importModal" class="fixed inset-0 bg-slate-900/55 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 border border-slate-100 space-y-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3 shrink-0">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span class="material-icons-round text-emerald-600">move_to_inbox</span>
                <span>インポート</span>
            </h3>
            <button onclick="closeImportModal()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600">
                <span class="material-icons-round">close</span>
            </button>
        </div>

        <!-- タブ切り替えボタン -->
        <div class="flex border-b border-slate-200 text-sm font-semibold shrink-0">
            <button id="tabFileBtn" onclick="switchImportTab('file')" class="py-2 px-4 border-b-2 border-emerald-600 text-emerald-600">ローカルファイル</button>
            <button id="tabStorageBtn" onclick="switchImportTab('storage')" class="py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-700">localStorage</button>
            <button id="tabNetworkBtn" onclick="switchImportTab('network')" class="py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-700">ネットワーク</button>
        </div>

        <div class="space-y-4 overflow-y-auto flex-1 pr-1">
            <!-- ローカルファイルタブ内容 -->
            <div id="importTabFile" class="space-y-3">
                <label for="fileInput" class="border-2 border-dashed border-slate-300 hover:border-emerald-500 bg-slate-50 hover:bg-emerald-50/30 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all">
                    <span class="material-icons-round text-3xl text-slate-400 mb-1">upload_file</span>
                    <span class="text-xs font-semibold text-slate-600">ファイルを選択 または ドロップ</span>
                    <span class="text-xxs text-slate-400 mt-1">(.txt, .md, .json, .js, .html など)</span>
                    <input type="file" id="fileInput" onchange="handleFileSelect(event)" class="hidden" accept=".txt,.md,.json,.js,.ts,.html,.css,.rb,.svg">
                </label>
                <div id="fileInfo" class="text-xs text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 hidden"></div>
            </div>

            <!-- localStorageタブ内容 -->
            <div id="importTabStorage" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">保存済みデータから選択</label>
                    <select id="storageKeySelect" onchange="previewStorageData()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-500">
                        <option value="" selected>キーを選択...</option>
                    </select>
                </div>
            </div>

            <!-- ネットワークタブ内容 -->
            <div id="importTabNetwork" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">取得先URL (ネットワーク)</label>
                    <div class="flex space-x-2">
                        <input type="url" id="networkUrlInput" placeholder="https://example.com/data.txt" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-500">
                        <button onclick="fetchFromURL()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition-all shrink-0 flex items-center space-x-1">
                            <span class="material-icons-round text-sm">cloud_download</span>
                            <span>取得</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- テキストプレビュー表示領域 -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">インポート内容プレビュー</label>
                <textarea id="importPreview" readonly placeholder="読み込んだテキストがここに表示されます..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono h-32 focus:outline-none resize-none leading-relaxed text-slate-700"></textarea>
            </div>

            <!-- 取込方法オプション -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">取込方式</label>
                <select id="importModeSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-emerald-500">
                    <option value="replace">現在のメモ本文を置換 (上書き)</option>
                    <option value="append">現在のメモ本文の末尾に追加</option>
                    <option value="new" selected>新しいメモを作成して読み込み</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end space-x-2 border-t border-slate-100 pt-3 shrink-0">
            <button onclick="closeImportModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-all">キャンセル</button>
            <button onclick="applyImport()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition-all flex items-center space-x-1 shadow-md shadow-emerald-500/10">
                <span class="material-icons-round text-sm">check</span>
                <span>インポート実行</span>
            </button>
        </div>
    </div>
</div>

<div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm"></div>

<script src="https://e24028.github.io/javascript.js"></script>
<script>
let memoDocId = '1YGfCr756J_bouUhz9_Eg-cWjD86o6zbBMuYoWCqzkbI';
let API_URL = DocAPI_1 + memoDocId;
let accessMap = {
    "un-published": "非公開",
    "read-only": "閲覧のみ",
    "edit": "編集可能"
};

let state = {
    user: { name: '', email: '' },
    memos: {}
};

let currentMemoId = '';
let defaultTitle = q('title').innerText;

/* 自動保存用タイムスタンプ管理変数 */
let lastEditedTime = 0;
let unsaved = false;
let isAutoSaveEnabled = true;

async function onLoad()
{
    let savedUser = localStorage.getItem('chat_user');
    if (!savedUser)
    {
        redirectToLogin();
        return;
    }

    getLastLogin('memo');

    try
    {
        let parsed = savedUser.parseJSON();
        state.user.name = parsed.name || '';
        state.user.email = parsed.email || '';

        if (!state.user.name || !state.user.email)
        {
            redirectToLogin();
            return;
        }

        'currentUsername'.byId().innerText = state.user.name;
        'currentUserEmail'.byId().innerText = state.user.email;
        'userAvatar'.byId().innerText = state.user.name.charAt(0).toUpperCase();

        await fetchData();
        await loadAccessModal();

        if ('autoSaveToggle'.byId())
        {
            'autoSaveToggle'.byId().checked = isAutoSaveEnabled;
        }

        // 1秒周期で自動保存監視タイマーを稼働
        setInterval(checkAutoSave, 1000);
    } catch (e) {
        showToast(e, 'error');
        redirectToLogin();
    }
}

/* メモ編集時のイベントハンドラー */
function onMemoEdit()
{
    lastEditedTime = Date.now();
    unsaved = true;
}

/* 自動保存判定処理 (最終編集から10秒経過かつ変更ありのときに保存) */
async function checkAutoSave()
{
    if (isAutoSaveEnabled && unsaved && lastEditedTime > 0 && (Date.now() - lastEditedTime >= 10000))
    {
        unsaved = false;
        lastEditedTime = 0;
        await saveCurrentMemo(true);
    }
}

function toggleAutoSaveOption()
{
    let checkbox = 'autoSaveToggle'.byId();
    if (!checkbox) return;

    isAutoSaveEnabled = checkbox.checked;
    localStorage.setItem('autoSaveEnabled', isAutoSaveEnabled);

    if (isAutoSaveEnabled)
    {
        showToast('自動保存を有効にしました', 'info');
    } else {
        showToast('自動保存を無効にしました', 'info');
    }
}

function getLastLogin(redirectStr)
{
    let EXPIRE_TIME = 7 * 24 * 3600000;
    let lastLoginStr = localStorage.getItem('workspace_lastLoginTime');
    let redirectTo = redirectStr || 'home';

    if (!lastLoginStr)
    {
        alert('セッションの有効期限が切れました。再度ログインしてください。');
        setParams2(['redirectTo', redirectTo]);
        history.replaceState('', null, location.href.replaceAll(`/${redirectTo}/`, '/login/'));
        setTimeout((function() { location.reload(); }), 800);
        return;
    }

    let lastLoginTime = parseInt(lastLoginStr, 10);
    let currentTime = Date.now();

    if (currentTime - lastLoginTime > EXPIRE_TIME)
    {
        alert('セッションの有効期限が切れました。再度ログインしてください。');
        localStorage.removeItem('workspace_lastLoginTime'); 
        setParams2(['redirectTo', redirectTo]);
        history.replaceState('', null, location.href.replaceAll(`/${redirectTo}/`, '/login/'));
        setTimeout(
            (
                function() {
                    location.reload();
                }
            ),
        800);
    }
}

async function fetchData()
{
    updateSyncStatus(false, '同期中...');

    try
    {
        let data = (await API_URL.fetch()).parseJSON();
        let parsedData = data && data.text ? data.text.parseJSON() : (data || {});
        state.memos = typeof parsedData === 'object' && !Array.isArray(parsedData) ? parsedData : {};

        renderMemoList();

        let paramMemoId = getParams2('memo');
        if (paramMemoId && state.memos[paramMemoId] && getPermission(paramMemoId) !== 'un-published')
        {
            selectMemo(paramMemoId);
        } else {
            let accessibleKeys = Object.keys(state.memos).filter(id => getPermission(id) !== 'un-published');

            if (accessibleKeys.length > 0)
            {
                selectMemo(accessibleKeys[0]);
            } else {
                createNewMemo();
            }
        }

        updateSyncStatus(true, '同期完了');
    } catch (e) {
        showToast(e, 'error');
        toggleAPI();
        updateSyncStatus(false, '接続エラー');
    }
}

function getPermission(memoId)
{
    let memo = state.memos[memoId];
    if (!memo) return 'un-published';

    // 管理者および作成者は常に編集権限を保持
    if (state.user.name === 'E24028' || state.user.name === memo.createdBy)
    {
        return 'edit';
    }

    // 個別権限設定がある場合は最優先
    if (memo['personal-access'] && memo['personal-access'][state.user.name])
    {
        return memo['personal-access'][state.user.name];
    }

    // 基本権限を適用
    return memo['basic-access'] || 'un-published';
}

function renderMemoList()
{
    let container = 'memoList'.byId();
    container.innerHTML = '';

    let memoIds = Object.keys(state.memos).filter(id => getPermission(id) !== 'un-published');
    memoIds.newSort();

    'memoCount'.byId().innerText = memoIds.length;

    memoIds.forEach(
        id => {
            let memo = state.memos[id];
            let isSelected = (id === currentMemoId);
            let perm = getPermission(id);

            let btn = document.createElement('button');
            btn.onclick = () => selectMemo(id);
            btn.className = `w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${isSelected ? 'bg-blue-600/10 text-blue-400 border-l-4 border-blue-500' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`;

            let icon = perm === 'edit' ? 'description' : 'visibility';
            btn.innerHTML = `
                <div class="flex items-center space-x-2.5 truncate">
                    <span class="material-icons-round text-base shrink-0">${icon}</span>
                    <span class="truncate">${escapeHtml(memo.title || '無題のメモ')}</span>
                </div>
                <span class="text-xxs px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 shrink-0">${escapeHtml(memo.createdBy || 'Unknown')}</span>
            `;
            container.appendChild(btn);
        }
    );

    let homeBtn = document.createElement('button');
    homeBtn.onclick = () => {
        history.replaceState('', null, location.href.replace(/\/memo\//g, '/home/'));
        setTimeout((function() { location.reload(); }), 800);
    };

    homeBtn.className = `w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition-all mt-4`;
    homeBtn.innerHTML = `
        <div class="flex items-center space-x-2.5 truncate">
            <span class="material-icons-round text-base shrink-0">home</span>
            <span class="truncate">ホームへ戻る</span>
        </div>
    `;
    container.appendChild(homeBtn);
}

function selectMemo(memoId)
{
    let perm = getPermission(memoId);

    if (perm === 'un-published')
    {
        showToast('このメモへのアクセス権限がありません', 'error');
        return;
    }

    currentMemoId = memoId;
    setParams2(['memo', memoId]);

    let memo = state.memos[memoId];
    'memoTitleInput'.byId().value = memo.title || '';
    'memoTextInput'.byId().value = memo.text || '';

    q('title').innerText = `${defaultTitle} - ${memo.title || '無題のメモ'}`;
    'headerTitle'.byId().innerText = memo.title || '無題のメモ';
    'headerSub'.byId().innerText = (memo.createdBy || 'Unknown');

    let isEditable = (perm === 'edit');
    'memoTitleInput'.byId().disabled = !isEditable;
    'memoTextInput'.byId().disabled = !isEditable;
    'btnSaveMemo'.byId().style.display = isEditable ? 'flex' : 'none';

    let canManageAccess = (state.user.name === 'E24028' || state.user.name === memo.createdBy);
    'btnAccessConfig'.byId().style.display = 'flex';
    'btnDeleteMemo'.byId().style.display = canManageAccess ? 'flex' : 'none';

    // 選択切替時は自動保存状態をリセット
    unsaved = false;
    lastEditedTime = 0;

    renderMemoList();

    if (window.innerWidth < 768)
    {
        'sidebar'.byId().classList.add('-translate-x-full');
    }
}

function createNewMemo()
{
    let newId = 'memo_' + Math.random().toString(36).substring(2, 10);

    state.memos[newId] = {
        title: '新しいメモ',
        createdBy: state.user.name,
        'basic-access': 'read-only',
        'personal-access': {},
        text: ''
    };

    currentMemoId = newId;
    setParams2(['memo', newId]);
    selectMemo(newId);
    saveAllData('新規メモを作成しました');
}

async function saveCurrentMemo(isAutoSave = false)
{
    if (!currentMemoId || !state.memos[currentMemoId]) return;

    let perm = getPermission(currentMemoId);

    if (perm !== 'edit')
    {
        if (!isAutoSave) showToast('編集権限がありません', 'error');
        return;
    }

    state.memos[currentMemoId].title = 'memoTitleInput'.byId().value.trim() || '無題のメモ';
    state.memos[currentMemoId].text = 'memoTextInput'.byId().value;

    let msg = isAutoSave ? '自動保存されました' : 'メモを保存しました';
    await saveAllData(msg);
    selectMemo(currentMemoId);
}

async function deleteCurrentMemo()
{
    if (!currentMemoId || !state.memos[currentMemoId]) return;

    let memo = state.memos[currentMemoId];
    if (state.user.name !== 'E24028' && state.user.name !== memo.createdBy)
    {
        showToast('削除権限がありません（作成者または管理者のみ削除可能です）', 'error');
        return;
    }

    if (confirm(`メモ「${memo.title}」を削除しますか？`))
    {
        let deletedId = currentMemoId;
        delete state.memos[deletedId];
        
        await saveAllData('メモを削除しました。', deletedId);
        
        currentMemoId = '';

        let accessibleKeys = Object.keys(state.memos).filter(id => getPermission(id) !== 'un-published');

        if (accessibleKeys.length > 0)
        {
            selectMemo(accessibleKeys[0]);
        } else {
            createNewMemo();
        }
    }
}

function exportText()
{
    if (!confirm('エクスポートしますか？')) return;

    if (!currentMemoId || !state.memos[currentMemoId])
    {
        showToast('選択されたメモがありません', 'error');
        return;
    }

    let memo = state.memos[currentMemoId];

    let storageName = ('SmartWorkspace メモ帳 - ' + memo.title + ' - ' + getRandom2(0, 9) + getRandom2(0, 9) + getRandom2(0, 9));
    localStorage.setItem(`data: ${storageName}`, memo.text);
    showToast('エクスポート完了！', 'success');

    window.open(`https://e24028.github.io/テキストエディター2.html?select=${storageName}&fontSize=20px&darkmode=false`);
}

async function saveAllData(successMsg = '保存しました', deletedMemoId = null)
{
    updateSyncStatus(false, '保存中...');

    try
    {
        let data = (await API_URL.fetch()).parseJSON();
        let serverData = data && data.text ? data.text.parseJSON() : (data || {});
        let mergedMemos = (typeof serverData === 'object' && !Array.isArray(serverData)) ? serverData : {};

        if (deletedMemoId && mergedMemos[deletedMemoId])
        {
            delete mergedMemos[deletedMemoId];
        }

        Object.keys(state.memos).forEach(
            (id) => {
                mergedMemos[id] = state.memos[id];
            }
        );

        await API_URL.fetch(
            {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: ({ text: mergedMemos.JSONstring(null, 2) }).JSONstring()
            }
        );

        state.memos = mergedMemos;
        renderMemoList();
        updateSyncStatus(true, '同期完了');
        showToast(successMsg, 'success');
    } catch (e) {
        showToast(e.message || '保存に失敗しました', 'error');
        updateSyncStatus(false, '保存エラー');
    }
}

/* --- AI アシスタント関連機能 --- */
function openAIModal()
{
    'aiResultPreview'.byId().value = '';
    'aiPromptInput'.byId().value = '';

    let perm = getPermission(currentMemoId);
    let isEditable = (perm === 'edit');
    let selectElem = 'aiApplyModeSelect'.byId();

    selectElem.options[0].disabled = !isEditable;
    selectElem.options[1].disabled = !isEditable;

    if (!isEditable)
    {
        selectElem.value = 'new';
    } else {
        selectElem.value = 'append';
    }

    'aiModal'.byId().classList.replace('hidden', 'flex');
}

function closeAIModal()
{
    'aiModal'.byId().classList.replace('flex', 'hidden');
}

function setAIPromptPreset(type)
{
    let promptInput = 'aiPromptInput'.byId();

    switch (type) {
        case 'summarize':
            promptInput.value = "以下の文章の主要なポイントを箇条書きで分かりやすく要約してください。";
            break;
        case 'proofread':
            promptInput.value = "以下の文章の誤字脱字を修正し、より読みやすく自然な文章に修正してください。";
            break;
        case 'expand':
            promptInput.value = "以下のメモの内容に、詳細な説明や具体的な内容を追加してください。";
            break;
        case 'translate':
            promptInput.value = "以下の文章を自然な英語に翻訳してください。";
            break;
    }
}

async function runAIGenerate()
{
    let systemText = 'aiSystemInput'.byId().value.trim();
    let userPrompt = 'aiPromptInput'.byId().value.trim();
    let currentText = 'memoTextInput'.byId().value.trim();
    let currentTitle = 'memoTitleInput'.byId().value.trim();

    if (!userPrompt)
    {
        showToast('AIへの指示を入力してください', 'error');
        return;
    }

    let btnRun = 'btnRunAI'.byId();
    let indicator = 'aiLoadingIndicator'.byId();
    
    btnRun.disabled = true;
    btnRun.classList.add('opacity-50');
    indicator.classList.remove('hidden');
    indicator.classList.add('flex');

    try
    {
        let response = await askAI(systemText, `${userPrompt}\n\n【タイトル】\n${currentTitle}\n\n【本文】\n${currentText}`);
        'aiResultPreview'.byId().value = response;
        showToast('AI応答の生成が完了しました', 'success');
    } catch (e) {
        showToast('AI生成エラー：' + (e.message || e), 'error');
    } finally {
        btnRun.disabled = false;
        btnRun.classList.remove('opacity-50');
        indicator.classList.add('hidden');
        indicator.classList.remove('flex');
    }
}

function applyAIResult()
{
    let resultText = 'aiResultPreview'.byId().value;
    if (!resultText)
    {
        showToast('反映するAI生成結果がありません', 'error');
        return;
    }

    let mode = 'aiApplyModeSelect'.byId().value;

    if (mode === 'new')
    {
        let newId = 'memo_' + Math.random().toString(36).substring(2, 10);
        state.memos[newId] = {
            title: 'AI生成メモ',
            createdBy: state.user.name,
            'basic-access': 'read-only',
            'personal-access': {},
            text: resultText
        };
        currentMemoId = newId;
        setParams2(['memo', newId]);
        selectMemo(newId);
        saveAllData('AI生成メモを作成しました');
    } else {
        if (!currentMemoId || !state.memos[currentMemoId])
        {
            showToast('対象のメモが選択されていません', 'error');
            return;
        }

        if (getPermission(currentMemoId) !== 'edit')
        {
            showToast('編集権限がありません', 'error');
            return;
        }

        let textArea = 'memoTextInput'.byId();
        if (mode === 'replace')
        {
            textArea.value = resultText;
        } else if (mode === 'append') {
            textArea.value = (textArea.value ? (textArea.value + '\n\n--- AI Assistant ---\n') : '') + resultText;
        }

        state.memos[currentMemoId].text = textArea.value;
        onMemoEdit();
        showToast('AIの生成結果をメモに反映しました', 'success');
    }

    closeAIModal();
}

/* クイックAIアクション */
async function quickAISummarize()
{
    let content = 'memoTextInput'.byId().value.trim();
    let title = 'memoTitleInput'.byId().value.trim();

    if (!content)
    {
        showToast('要約する本文がありません', 'error');
        return;
    }

    showToast('AI要約を実行中...', 'info');
    try
    {
        let summary = await askAI(
            "あなたは要約作成のプロです。重要なポイントを簡潔な箇条書きでまとめてください。",
            `【タイトル】\n${title}\n\n【内容】\n${content}`
        );

        let textArea = 'memoTextInput'.byId();
        textArea.value = textArea.value + '\n\n【要約】\n' + summary;
        state.memos[currentMemoId].text = textArea.value;
        onMemoEdit();
        showToast('要約をメモの末尾に追加しました', 'success');
    } catch (e) {
        showToast('AI要約失敗：' + (e.message || e), 'error');
    }
}

async function quickAIFixGrammar()
{
    let content = 'memoTextInput'.byId().value.trim();
    let title = 'memoTitleInput'.byId().value.trim();

    if (!content)
    {
        showToast('校正する本文がありません', 'error');
        return;
    }

    showToast('AI校正を実行中...', 'info');
    try
    {
        let fixed = await askAI(
            "あなたはプロの文章校正者です。自然な文章に修正し、誤字脱字を直してください。説明は不要で、修正後の本文のみを返してください。",
            `【タイトル】\n${title}\n\n【内容】\n${content}`
        );

        'memoTextInput'.byId().value = fixed;
        state.memos[currentMemoId].text = fixed;
        onMemoEdit();
        showToast('文章の校正が完了しました', 'success');
    } catch (e) {
        showToast('AI校正失敗：' + (e.message || e), 'error');
    }
}

async function quickAIGenerateTitle()
{
    let content = 'memoTextInput'.byId().value.trim();
    let title = 'memoTitleInput'.byId().value.trim();

    if (!content)
    {
        showToast('タイトル生成に使用する本文がありません', 'error');
        return;
    }

    showToast('タイトル生成中...', 'info');
    try
    {
        let generatedTitle = await askAI(
            "あなたは優秀なライターです。渡された文章に最もふさわしい、20文字以内の魅力的で分かりやすいタイトルを1つだけ考案してください。タイトル文字列のみを出力してください。",
            `【元のタイトル】\n${title}\n\n【内容】\n${content}`
        );

        generatedTitle = generatedTitle.replace(/^["'「『]|["'」』]$/g, '').trim();
        'memoTitleInput'.byId().value = generatedTitle;
        'headerTitle'.byId().innerText = generatedTitle;
        state.memos[currentMemoId].title = generatedTitle;
        onMemoEdit();
        showToast('タイトルを更新しました', 'success');
    } catch (e) {
        showToast('タイトル生成失敗：' + (e.message || e), 'error');
    }
}

function openAccessModal()
{
    if (!currentMemoId || !state.memos[currentMemoId]) return;

    let memo = state.memos[currentMemoId];
    let canManageAccess = (state.user.name === 'E24028' || state.user.name === memo.createdBy);

    'basicAccessSelect'.byId().value = memo['basic-access'] || 'un-published';
    'basicAccessSelect'.byId().disabled = !canManageAccess;

    'targetUsernameInput'.byId().disabled = !canManageAccess;
    'personalAccessSelect'.byId().disabled = !canManageAccess;
    'btnAddPersonalAccess'.byId().disabled = !canManageAccess;
    'btnAddPersonalAccess'.byId().classList.toggle('opacity-50', !canManageAccess);

    let btnSave = 'btnSaveAccess'.byId();
    btnSave.disabled = !canManageAccess;
    btnSave.classList.toggle('opacity-50', !canManageAccess);
    btnSave.classList.toggle('cursor-not-allowed', !canManageAccess);

    'accessModalWarning'.byId().classList.toggle('hidden', canManageAccess);

    loadAccessModal();
    renderPersonalAccessList();

    'accessModal'.byId().classList.replace('hidden', 'flex');
}

async function loadAccessModal()
{
    try
    {
        let res = await fetchDoc();
        let userList = [];

        if (res)
        {
            let parsed = res.parseJSON().users;
            userList = Object.keys(parsed);
        }

        let selectElem = 'targetUsernameInput'.byId();
        selectElem.innerHTML = '<option value="">ユーザーを選択...</option>';

        let memo = state.memos[currentMemoId];
        let creator = memo ? memo.createdBy : '';

        userList.newSort().forEach(
            (username) => {
                if (username !== state.user.name && username !== 'E24028' && username !== creator)
                {
                    let opt = document.createElement('option');
                    opt.value = username;
                    opt.innerText = username;
                    selectElem.appendChild(opt);
                }
            }
        );
    } catch (e) {
        console.error('ユーザー一覧の取得に失敗しました：', e);
    }
}

function closeAccessModal(shouldSave = true)
{
    if (shouldSave && currentMemoId && state.memos[currentMemoId])
    {
        let memo = state.memos[currentMemoId];
        if (state.user.name === 'E24028' || state.user.name === memo.createdBy)
        {
            state.memos[currentMemoId]['basic-access'] = 'basicAccessSelect'.byId().value;
            saveAllData('アクセス権限設定を更新しました');
        }
    }

    'accessModal'.byId().classList.replace('flex', 'hidden');
}

function renderPersonalAccessList()
{
    let container = 'personalAccessList'.byId();
    container.innerHTML = '';

    let memo = state.memos[currentMemoId];
    let canManageAccess = (state.user.name === 'E24028' || state.user.name === memo.createdBy);
    let pAccess = memo['personal-access'] || {};
    let entries = Object.entries(pAccess);

    if (entries.length === 0)
    {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">個別の権限設定はありません</p>`;
        return;
    }

    entries.forEach(
        ([username, level]) => {
            let div = document.createElement('div');
            div.className = 'flex items-center justify-between text-xs bg-white p-2 rounded-lg border border-slate-200';
            div.innerHTML = `<div>
                    <span class="font-bold text-slate-700">${escapeHtml(username)}</span>
                    <span class="text-slate-400 ml-2">(${accessMap[level]})</span>
                </div>
                ${canManageAccess ? `
                <button onclick="removePersonalAccessRule('${escapeHtml(username)}')" class="text-slate-500 hover:text-slate-700 p-1">
                    <span class="material-icons-round text-sm">close</span>
                </button>
                ` : ''}
            `;
            container.appendChild(div);
        }
    );
}

function addPersonalAccessRule()
{
    let username = 'targetUsernameInput'.byId().value.trim();
    let level = 'personalAccessSelect'.byId().value;

    if (!username) return;

    if (!state.memos[currentMemoId]['personal-access'])
    {
        state.memos[currentMemoId]['personal-access'] = {};
    }

    state.memos[currentMemoId]['personal-access'][username] = level;
    'targetUsernameInput'.byId().value = '';
    renderPersonalAccessList();
}

function removePersonalAccessRule(username)
{
    if (state.memos[currentMemoId]['personal-access'] && state.memos[currentMemoId]['personal-access'][username])
    {
        delete state.memos[currentMemoId]['personal-access'][username];
        renderPersonalAccessList();
    }
}

/* --- インポート用関数群 --- */
let importState = {
    text: '',
    fileName: ''
};

function openImportModal()
{
    importState.text = '';
    importState.fileName = '';
    'importPreview'.byId().value = '';
    'fileInfo'.byId().classList.add('hidden');
    'fileInput'.byId().value = '';
    'networkUrlInput'.byId().value = '';

    let perm = getPermission(currentMemoId);
    let isEditable = (perm === 'edit');
    let selectElem = 'importModeSelect'.byId();

    selectElem.options[0].disabled = !isEditable;
    selectElem.options[1].disabled = !isEditable;

    if (!isEditable)
    {
        selectElem.value = 'new';
    }

    switchImportTab('file');
    populateStorageKeys();

    'importModal'.byId().classList.replace('hidden', 'flex');
}

function closeImportModal()
{
    'importModal'.byId().classList.replace('flex', 'hidden');
}

function switchImportTab(tab)
{
    let isFile = (tab === 'file');
    let isStorage = (tab === 'storage');
    let isNetwork = (tab === 'network');

    'importTabFile'.byId().classList.toggle('hidden', !isFile);
    'importTabStorage'.byId().classList.toggle('hidden', !isStorage);
    'importTabNetwork'.byId().classList.toggle('hidden', !isNetwork);

    'tabFileBtn'.byId().className = isFile
        ? 'py-2 px-4 border-b-2 border-emerald-600 text-emerald-600'
        : 'py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-700';

    'tabStorageBtn'.byId().className = isStorage
        ? 'py-2 px-4 border-b-2 border-emerald-600 text-emerald-600'
        : 'py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-700';

    'tabNetworkBtn'.byId().className = isNetwork
        ? 'py-2 px-4 border-b-2 border-emerald-600 text-emerald-600'
        : 'py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-700';

    if (isStorage)
    {
        previewStorageData();
    } else {
        'importPreview'.byId().value = importState.text;
    }
}

async function fetchFromURL()
{
    let url = 'networkUrlInput'.byId().value.trim();

    if (!url)
    {
        showToast('URLを入力してください', 'error');
        return;
    }

    try
    {
        showToast('データを取得中...', 'info');
        let text = await url.fetch();
        importState.text = text;
        importState.fileName = url.split('/').pop() || url;
        'importPreview'.byId().value = text;
        showToast('データの取得に成功しました', 'success');
    } catch (e) {
        showToast(e.message || '取得に失敗しました', 'error');
    }
}

function handleFileSelect(event)
{
    let file = event.target.files[0];
    if (!file) return;

    let reader = new FileReader();
    reader.onload = (e) => {
        importState.text = e.target.result || '';
        importState.fileName = file.name.replace(/\.[^/.]+$/, "");

        'importPreview'.byId().value = importState.text;

        let infoElem = 'fileInfo'.byId();
        infoElem.innerText = `選択中：${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
        infoElem.classList.remove('hidden');
    };
    reader.readAsText(file);
}

function populateStorageKeys()
{
    let select = 'storageKeySelect'.byId();
    select.innerHTML = '<option value="" selected>キーを選択...</option>';

    Object.entries(localStorage.newSort()).map(
        ([key, value]) => {
            let opt = document.createElement('option');
            opt.value = key;
            opt.innerText = key;
            select.appendChild(opt);
        }
    );
}

function previewStorageData()
{
    let key = 'storageKeySelect'.byId().value;

    if (!key)
    {
        if ('importTabStorage'.byId().classList.contains('hidden') === false)
        {
            'importPreview'.byId().value = '';
        }
        return;
    }

    let val = localStorage.getItem(key) || '';
    importState.text = val;
    importState.fileName = key;
    'importPreview'.byId().value = val;
}

function applyImport()
{
    let content = 'importPreview'.byId().value;
    if (!content && content !== '')
    {
        showToast('インポートするデータがありません', 'error');
        return;
    }

    let mode = 'importModeSelect'.byId().value;

    if (mode === 'new')
    {
        let newId = 'memo_' + Math.random().toString(36).substring(2, 10);
        state.memos[newId] = {
            title: importState.fileName || 'インポートしたメモ',
            createdBy: state.user.name,
            'basic-access': 'read-only',
            'personal-access': {},
            text: content
        };
        currentMemoId = newId;
        setParams2(['memo', newId]);
        selectMemo(newId);
        saveAllData('新規メモとしてインポートしました');
    } else {
        if (!currentMemoId || !state.memos[currentMemoId])
        {
            showToast('対象のメモがありません。新規作成してください。', 'error');
            return;
        }

        if (getPermission(currentMemoId) !== 'edit')
        {
            showToast('編集権限がありません', 'error');
            return;
        }

        let textArea = 'memoTextInput'.byId();
        if (mode === 'replace')
        {
            textArea.value = content;
        } else if (mode === 'append') {
            textArea.value = (textArea.value ? (textArea.value + '\n\n') : '') + content;
        }

        state.memos[currentMemoId].text = textArea.value;
        onMemoEdit();
        showToast('テキストをインポートしました（保存ボタンを押して確定）', 'success');
    }

    closeImportModal();
}

function updateSyncStatus(isOk, text)
{
    'syncText'.byId().innerText = text;
    'syncIndicator'.byId().className = isOk
        ? 'inline-block w-2 h-2 rounded-full bg-emerald-500'
        : 'inline-block w-2 h-2 rounded-full bg-red-500 animate-pulse';
}

function redirectToLogin()
{
    setParams2(['redirectTo', 'memo']);
    history.replaceState('', null, location.href.replace(/\/memo\//g, '/login/'));
    setTimeout((function() { location.reload(); }), 800);
}

function logout()
{
    if (confirm('ログアウトしますか？'))
    {
        localStorage.removeItem('chat_user');
        redirectToLogin();
    }
}

function viewMyPage()
{
    setParams2(['selectName', state.user.name]);
    history.replaceState('', null, location.href.replace(/\/memo\//g, '/user/'));
    setTimeout((function() { location.reload(); }), 800);
}

function viewUserPage()
{
    setParams2(['selectName', state.memos[currentMemoId].createdBy]);
    history.replaceState('', null, location.href.replace(/\/memo\//g, '/user/'));
    setTimeout((function() { location.reload(); }), 800);
}

function redirectHome()
{
    history.replaceState('', null, location.href.replace(/\/memo\//g, '/home/'));
    setTimeout((function() { location.reload(); }), 800);
}

function toggleSidebar()
{
    'sidebar'.byId().classList.toggle('-translate-x-full');
}

function toggleAPI()
{
    if (confirm('APIを「予備」に切り替えますか？'))
    {
        API_URL = DocAPI_2 + memoDocId;
        showToast('APIを予備エンドポイントに切り替えました', 'info');
    }
}

function escapeHtml(str)
{
    return (typeof str !== 'string')
        ? ''
        : str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
}

function showToast(message, type = 'info')
{
    let container = 'toastContainer'.byId();
    let toast = document.createElement('div');
    let bgClass = 'bg-blue-600 text-white';
    let icon = 'info_outline';

    if (type === 'success')
    {
        bgClass = 'bg-emerald-600 text-white';
        icon = 'check_circle_outline';
        console.log(message || 'log');
    } else if (type === 'error') {
        bgClass = 'bg-red-600 text-white';
        icon = 'error_outline';
        console.error(message || 'log');
    }

    toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-lg text-sm pointer-events-auto transition-all ${bgClass}`;
    toast.innerHTML = `<span class="material-icons-round text-lg shrink-0">${icon}</span><span class="font-medium">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}

if ('serviceWorker' in navigator)
{
    window.addEventListener('load',
        () => {
            navigator.serviceWorker.register('/SmartWorkspace/service-worker.js').then(
                (reg) => console.log('Service Worker 登録成功:', reg.scope)
            ).catch(
                (err) => console.error('Service Worker 登録失敗:', err)
            );
        }
    );
}
