<html>
<head>
<meta charset="UTF-8">
<title>URL エンコーダー&デコーダー</title>
<style>
html
{
    width: 100%;
    height: 100%;
}

body
{
    background-color: RGB(240, 240, 240);
    zoom: 50%;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    overflow: auto;
}

.Text
{
    font-size: 2em;
    text-align: center;
    margin: 0.5em;
}

.Text_large
{
    font-size: 4em;
    text-align: center;
    margin: 0px;
}

#Text_1, #Text_2
{
    width: 50%;
    font-size: 2em;
    text-align: center;
}

#Input, #Output
{
    width: 50%;
    resize: none;
    font-size: 2em;
    font-family: "Source Code Pro", "monospace", "Roboto", "Arial", "Lato", "sans-serif";
}

#UpBox
{
    width: 100%;
    display: flex;
}

#DownBox
{
    width: 100%;
    height: 54vw;
    display: flex;
}

button
{
    width: 50%;
    height: 50px;
    font-size: 2em;
}
</style>
</head>

<body>
<p class="Text_large">URL エンコーダー&デコーダー</p>
<p class="Text">どちらにも入力できます。右はデコード画面、左はエンコード画面です。</p>
<p class="Text">なお、両画面は16 : 9 のサイズ比です。</p>

<div class="container" id="UpBox">
    <p id="Text_1">デコード画面</p>
    <p id="Text_2">エンコード画面</p>
</div>

<div class="container" id="DownBox">
    <textarea id="Input" wrap="soft" oninput="Encode()"></textarea>
    <textarea id="Output" wrap="soft" oninput="Decode()"></textarea>
</div>
<div class="container" id="UpBox">
    <button onclick="clipboard()">copy Decoded</button>
    <button onclick="clipboard2()">copy Encoded</button>
</div>

<p></p>
<button id="colorMode" onclick="darkMode()">ダークモードに切り替え</button>

<script>
let body = document.querySelector('body');
let input = document.getElementById('Input');
let output = document.getElementById('Output');
let colorMode = document.getElementById('colorMode');

// エンコードされない文字列
const myMap = {
    '!' : '%21',
    '\'' : '%27',
    '(' : '%28',
    ')' : '%29',
    '*' : '%2A',
    '-' : '%2D',
    '.' : '%2E',
    '0' : '%30',
    '1' : '%31',
    '2' : '%32',
    '3' : '%33',
    '4' : '%34',
    '5' : '%35',
    '6' : '%36',
    '7' : '%37',
    '8' : '%38',
    '9' : '%39',
    'A' : '%41',
    'B' : '%42',
    'C' : '%43',
    'D' : '%44',
    'E' : '%45',
    'F' : '%46',
    'G' : '%47',
    'H' : '%48',
    'I' : '%49',
    'J' : '%4A',
    'K' : '%4B',
    'L' : '%4C',
    'M' : '%4D',
    'N' : '%4E',
    'O' : '%4F',
    'P' : '%50',
    'Q' : '%51',
    'R' : '%52',
    'S' : '%53',
    'T' : '%54',
    'U' : '%55',
    'V' : '%56',
    'W' : '%57',
    'X' : '%58',
    'Y' : '%59',
    'Z' : '%5A',
    '_' : '%5F',
    'a' : '%61',
    'b' : '%62',
    'c' : '%63',
    'd' : '%64',
    'e' : '%65',
    'f' : '%66',
    'g' : '%67',
    'h' : '%68',
    'i' : '%69',
    'j' : '%6A',
    'k' : '%6B',
    'l' : '%6C',
    'm' : '%6D',
    'n' : '%6E',
    'o' : '%6F',
    'p' : '%70',
    'q' : '%71',
    'r' : '%72',
    's' : '%73',
    't' : '%74',
    'u' : '%75',
    'v' : '%76',
    'w' : '%77',
    'x' : '%78',
    'y' : '%79',
    'z' : '%7A',
    '~' : '%7E'
};

function Encode()
{
    // 全ての文字を myMap に基づいて置換、なければ encodeURIComponent
    let Encoded = input.value.split('').map(
        char => {
            return myMap[char] || encodeURIComponent(char);
        }
    ).join('');

    output.value = Encoded;
}

function Decode()
{
    let Decoded = decodeURIComponent(output.value);
    input.value = Decoded;
}

function clipboard()
{
    navigator.clipboard.writeText(input.value);
    alert('copied! text: ' + input.value);
}

function clipboard2()
{
    navigator.clipboard.writeText(output.value);
    alert('copied! text: ' + output.value);
}

function darkMode()
{
    body.style.backgroundColor = 'rgb(15, 15, 15)';
    body.style.color = 'rgb(255, 255, 255)';
    input.style.backgroundColor = 'rgb(0, 0, 0)';
    input.style.color = 'rgb(255, 255, 255)';
    output.style.backgroundColor = 'rgb(0, 0, 0)';
    output.style.color = 'rgb(255, 255, 255)';
    colorMode.onclick = lightMode;
    colorMode.innerText = "ライトモードに切り替え";
}

function lightMode()
{
    body.style.backgroundColor = 'rgb(240, 240, 240)';
    body.style.color = 'rgb(0, 0, 0)';
    input.style.backgroundColor = 'rgb(255, 255, 255)';
    input.style.color = 'rgb(0, 0, 0)';
    output.style.backgroundColor = 'rgb(255, 255, 255)';
    output.style.color = 'rgb(0, 0, 0)';
    colorMode.onclick = darkMode;
    colorMode.innerText = "ダークモードに切り替え";
}
</script>
</body>
</html>
