<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/anki_sheet_editor/favicon.png">
<link rel="manifest" href="/anki_sheet_editor/manifest.json">
<title>暗記シートエディター</title>
<style>
:root
{
    --border-color: #222222;
    --answer-color: #ff6600;
    --bg-gray: #f4f6f8;
    --label-color: #777777;
}

*
{
    box-sizing: border-box;
}

html
{
    width: 100%;
    height: 100%;
}

body
{
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    margin: 20px;
    width: calc(100% - 40px);
    height: calc(100% - 40px);
    background-color: var(--bg-gray);
    overflow: auto;
    color: #111;
}

/* 操作・編集エリア */
.control-panel
{
    max-width: 900px;
    margin: 0px auto 24px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.08);
}

.control-header
{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.control-header h1
{
    font-size: 1.2rem;
    margin: 0px;
}

.btn-group
{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

button
{
    padding: 8px 14px;
    font-size: 0.9rem;
    font-weight: bold;
    border: 1px solid #cccccc;
    border-radius: 5px;
    background-color: #ffffff;
    cursor: pointer;
    transition: background-color 0.15s;
}

button:hover
{
    background-color: #eeeeee;
}

button.primary
{
    background-color: #0066cc;
    color: #ffffff;
    border-color: #0055aa;
}

button.primary:hover
{
    background-color: #0055aa;
}

button.primary:disabled
{
    background-color: #88aadd;
    color: #ffffff;
    border-color: #8899cc;
}

button.primary:disabled:hover
{
    background-color: #8899dd;
}

button.danger
{
    color: #cc0000;
    border-color: #e0b0b0;
}

button.danger:hover
{
    background-color: #ffeeee;
}

.hint
{
    font-size: 0.85rem;
    color: #555555;
    margin: 0px 0px 10px 0px;
}

.container
{
    display: flex;
    width: 100%;
}

label
{
    width: 100%;
}

label p
{
    font-size: 10px;
    color: var(--label-color);
    font-weight: bold;
    margin: 0px;
}

#titleInput, #countInput
{
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 0.95rem;
    border: 1px solid #bbbbbb;
    border-radius: 5px;
}

textarea
{
    width: 100%;
    height: 160px;
    padding: 12px;
    font-size: 1rem;
    line-height: 1.6;
    border: 1px solid #bbbbbb;
    border-radius: 5px;
    resize: vertical;
    font-family: inherit;
}

/* モーダルウィンドウ */
#modal
{
    width: 100%;
    height: 100%;
    top: 0px;
    left: 0px;
    position: fixed;
    background-color: rgba(0, 0, 0, 40%);
    z-index: 1000;
}

.inners
{
    zoom: 100%;
    width: 560px;
    max-width: calc(100vw - 32px);
    height: 440px;
    max-height: calc(100vh - 32px);
    border: 6px solid rgb(127, 127, 127);
    border-radius: 25px;
    margin: calc(50vh - 220px) auto;
    padding: 16px 20px;
    background-color: white;
    color: black;
    display: flex;
    flex-direction: column;
    text-align: center;
}

#modalText
{
    font-size: 1.25rem;
    margin: 4px 0px 12px 0px;
}

#modalArea
{
    flex: 1;
    overflow-y: auto;
    text-align: left;
    border-top: 1px solid #dddddd;
    border-bottom: 1px solid #dddddd;
    padding: 8px 4px;
    margin-bottom: 12px;
}

.modal-footer
{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0px;
}

.storage-item
{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid #dddddd;
    border-radius: 6px;
    background-color: #fafafa;
}

.storage-item.active
{
    border-color: #0066cc;
    background-color: #f0f7ff;
}

.storage-info
{
    flex: 1;
    min-width: 0;
}

.storage-title
{
    font-weight: bold;
    font-size: 0.95rem;
    margin: 0px 0px 4px 0px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.storage-badge
{
    display: inline-block;
    font-size: 0.72rem;
    padding: 1px 6px;
    margin-left: 6px;
    border-radius: 4px;
    background-color: #0066cc;
    color: #ffffff;
    vertical-align: middle;
}

.storage-preview
{
    font-size: 0.8rem;
    color: #666666;
    margin: 0px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.storage-actions
{
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.storage-actions button
{
    padding: 5px 10px;
    font-size: 0.8rem;
}

/* 印刷プレビュー（用紙）エリア */
.sheet-wrapper
{
    max-width: 900px;
    height: max-content;
    min-height: 100%;
    margin: 0px auto 24px auto;
    background: #ffffff;
    padding: 30px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    border-radius: 8px;
}

.sheet-title
{
    font-size: 1.3rem;
    font-weight: bold;
    margin: 0px 0px 14px 0px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border-color);
}

.sheet-title:empty
{
    display: none;
}

/* メインの表レイアウト */
.worksheet-table
{
    width: 100%;
    border: 1.5px solid var(--border-color);
}

/* 左側：問題文セル */
#question-cell
{
    width: 68%;
    padding: 14px 16px;
    font-size: 1.05rem;
    line-height: 1.9;
    letter-spacing: 0.03em;
    word-break: break-all;
}

#question-cell p
{
    margin: 0px 0px 0.6em 0px;
    text-indent: 1em;
}

#question-cell p:last-child
{
    margin-bottom: 0px;
}

#right-cell
{
    width: 32%;
}

.blank-marker
{
    font-weight: bold;
    padding: 2px 10px;
    border: 1px solid black;
}

/* 右側：番号セル */
.num-cell
{
    width: 24%;
    text-align: center;
    vertical-align: middle !important;
    font-size: 1rem;
    padding: 6px 0px;
    border-color: var(--border-color);
    border-style: solid;
    border-width: 0px 0px 1px 1px;
}

/* 右側：解答セル（オレンジ色） */
.answer-cell
{
    width: 76%;
    text-align: center;
    vertical-align: middle !important;
    font-size: 1.05rem;
    font-weight: bold;
    color: var(--answer-color);
    padding: 6px 8px;
    border-color: var(--border-color);
    border-style: solid;
    border-width: 0px 0px 1px 1px;
}

/* 解答非表示モード（テスト・赤シート用） */
body.hide-answers .answer-cell span
{
    visibility: hidden;
}

/* 印刷用スタイル */
@media print
{
    body
    {
        background: #ffffff;
        padding: 0;
        margin: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .control-panel, #modal
    {
        display: none !important;
    }

    .sheet-wrapper
    {
        max-width: 100%;
        width: 100%;
        margin: 0px;
        padding: 0px;
        box-shadow: none;
    }

    .answer-cell
    {
        color: #ffcc00 !important;
    }
}
</style>
</head>
<body onload="onLoad()">
<div id="main">
    <div class="control-panel">
        <div class="control-header">
            <h1>暗記シートエディター</h1>
            <div class="btn-group">
                <button onclick="openStorageModal()">シート一覧</button>
                <button onclick="aiFormat(event)">AIフォーマット</button>
                <button onclick="insertBracket(event)">【】を挿入</button>
                <button onclick="toggleAnswer()" id="toggleAnswerBtn">解答を隠す</button>
                <!--<button onclick="backSample()">サンプルに戻す</button>-->
                <button class="primary" onclick="print()">印刷</button>
            </div>
        </div>
        <p class="hint">
            <span>穴埋め形式にしたい語句を</span>
            <b>【語句】</b>
            <span>のように囲むと、自動で重複なく番号が振られ、穴埋めの答えがプレビュー画面に抽出されます。</span>
        </p>

        <div class="container" style="gap: 10px;">
            <label for="titleInput" style="width: calc(100% - 150px);">
                <p>タイトル（空欄なら非表示）</p>
                <input id="titleInput" type="text" placeholder="タイトルを入力..." oninput="renderWorksheet()">
            </label>
            <label for="countInput" style="width: 140px;">
                <p>初期の問題番号（空欄なら1）</p>
                <input id="countInput" type="number" placeholder="1" oninput="renderWorksheet()" style="text-align: center;">
            </label>
        </div>

        <label for="sourceEditor">
            <p>本文</p>
            <textarea id="sourceEditor" placeholder="本文を入力..." oninput="renderWorksheet()"></textarea>
        </label>
    </div>

    <div class="sheet-wrapper">
        <h2 id="sheetTitle" class="sheet-title"></h2>
        <div class="worksheet-table">
            <div id="worksheetBody" class="container">
                <div id="question-cell"></div>
                <div id="right-cell"></div>
            </div>
        </div>
    </div>
    <p style="height: 1px;"></p>
</div>

<div id="modal" style="display: none;" onclick="if (event.target === this) { closeModal(false) }">
    <div class="inners">
        <h1 id="modalText"></h1>
        <div id="modalArea"></div>
        <p class="modal-footer" id="modalFooter">
            <button onclick="closeModal(true)">確定</button>
            <button onclick="closeModal(false)">キャンセル</button>
        </p>
    </div>
</div>

<script src="https://e24028.github.io/javascript.js"></script>
<script>
let title = q('title');
let defaultTitle = title.innerText;
let storageId = getHash();
let STORAGE_PREFIX = 'anki_sheet_data_';

let presetTitle = '公民・政治分野 確認プリント';
let presetText = '選挙で議席の過半数を占めた政党を【与党】、それ以外の政党を【野党】と言う。また、このような政治体制を、【政党政治】と言う。\n日本国憲法では、国権の最高機関であり、国の唯一の立法機関は【国会】と定められている。';

let editor = 'sourceEditor'.byId();
let titleInput = 'titleInput'.byId();
let countInput = 'countInput'.byId();
let sheetTitle = 'sheetTitle'.byId();
let tbody = 'worksheetBody'.byId();

function onLoad()
{
    if (storageId)
    {
        loadSheetData(storageId);
    } else {
        let sheets = getSavedSheets();
        let newId = generateSafeKey();

        if (sheets.length !== 0)
        {
            // シートを切り替える
            newId = sheets[0].id;
            loadSheetData(newId);
        }

        setHash(newId);
    }
}

function loadSheetData(targetId)
{
    storageId = targetId;
    let storage = JSON.parse(localStorage.getItem(`${STORAGE_PREFIX}${storageId}`) || '{}');

    titleInput.value = storage.searchKey('title') || presetTitle;
    editor.value = storage.searchKey('text') || presetText;
    countInput.value = storage.searchKey('count') || '1';

    let shouldHide = (storage.searchKey('answer') === 'hidden');
    let isHidden = document.body.classList.contains('hide-answers');

    if (shouldHide !== isHidden)
    {
        document.body.classList.toggle('hide-answers');
        s('toggleAnswerBtn').innerText = shouldHide ? '解答を表示' : '解答を隠す';
    }

    renderWorksheet();
}

function toCircledNumber(num)
{
    // 数値を丸数字に変換（1〜50まで対応）
    if (num >= 1 && num <= 20)
    {
        return String.fromCharCode(0x2460 + num - 1);
    } else if (num >= 21 && num <= 35) {
        return String.fromCharCode(0x3251 + num - 21);
    } else if (num >= 36 && num <= 50) {
        return String.fromCharCode(0x32B1 + num - 36);
    } else {
        return `${num}.`;
    }
}

// HTMLエスケープ
function escapeHTML(str)
{
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function generateSafeKey()
{
    let result = [];
    let key = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_';

    for (let i = 0; i < 20; i++)
    {
        let index = getRandom2(0, key.length - 1);
        result.push(key[index]);
    }

    return result.join('');
}

// シートの複製
function duplicateWorksheet(oldId)
{
    let oldData = {};
    let newId = generateSafeKey();

    try
    {
        oldData = JSON.parse(localStorage.getItem(`${STORAGE_PREFIX}${oldId}`) || '{}');
    } catch (e) {
        console.error('シートの複製に失敗:', oldId, '⇒', newId, e);
    }

    localStorage.setItem(`${STORAGE_PREFIX}${newId}`,
        JSON.stringify(oldData, null, 4)
    );

    return newId;
}

// プレビューの再描画
function renderWorksheet()
{
    let titleText = titleInput.value.trim();
    let rawText = editor.value;
    let defaultCount = parseInt(countInput.value || '1');
    defaultCount = (defaultCount <= 1) ? 1 : defaultCount;

    sheetTitle.innerText = titleText;
    s('right-cell').innerHTML = '';

    // 入力内容を自動保存
    localStorage.setItem(`${STORAGE_PREFIX}${storageId}`,
        JSON.stringify(
            {
                'title': (titleText === presetTitle) ? '' : titleText,
                'text': (rawText === presetText) ? '' : rawText,
                'count': (defaultCount === 1) ? '' : defaultCount,
                'answer': (document.body.classList.contains('hide-answers')) ? 'hidden' : ''
            }, null, 4
        )
    );

    let answers = [];
    let counter = defaultCount;

    // 【...】を抽出し、問題文側を「①」などの丸数字に置換
    let paragraphs = rawText.split('\n').map(
        (line) => {
            let escaped = escapeHTML(line);

            let replaced = escaped.replace(/【([^【】]+)】/g,
                (match, answerText) => {
                    let indexOf = answers.indexOf(answerText);
                    let circled = toCircledNumber((indexOf + 1) ? (indexOf + defaultCount) : counter);

                    // 重複チェック
                    if (indexOf < 0)
                    {
                        answers.push(answerText);
                        counter++;
                    }

                    return `<span class="blank-marker">${circled}</span>`;
                }
            );

            return replaced ? `<p>${replaced}</p>` : '<p>&nbsp;</p>';
        }
    );

    // 最低でも1行分の枠を確保して見た目を整える
    let minRows = 1;
    let totalRows = Math.max(answers.length, minRows);

    // 問題文を描画
    s('question-cell').innerHTML = paragraphs.join('');

    for (let i = 0; i < totalRows; i++)
    {
        let tr = s('right-cell').addElem('div',
            {
                className: 'container'
            }
        );

        let item = answers[i];

        // 番号セル
        tr.addElem('div',
            {
                className: 'num-cell',
                innerText: toCircledNumber(i + defaultCount)
            }
        );

        // 解答セル（オレンジ色）
        let ansTd = tr.addElem('div',
            {
                className: 'answer-cell'
            }
        );

        ansTd.addElem('span',
            {
                innerHTML: item || ''
            }
        );
    }

    title.innerText = titleText ? `${defaultTitle} - ${titleText}` : defaultTitle;
}

// 選択範囲を【】で囲むボタン（javascript.js の getSelection / setSelection を活用）
function insertBracket(e)
{
    e.preventDefault();
    let [left, center, right] = editor.getSelection();

    if (center)
    {
        editor.setSelection(left, `【${center}】`, right);
    } else {
        editor.insertText('【】', -1);
    }

    editor.focus();
    renderWorksheet();
}

async function aiFormat(e)
{
    e.preventDefault();
    toggleDisableForm(true);

    try
    {
        editor.value = await askAI(`あなたは、プロの学習サポーターです。以下の文章（タイトル：${titleInput.value}）で、テスト問題の穴埋め形式で出題されそうな重要語句を**【語句】**のように囲って、暗記シートを生成してください。可読性を高めるために、一文あたり2個くらいで出力してください。なお、フォーマットなどのUIは自動で調整されるので、重要語句を囲んだ本文のみを出力してください。`, editor.value);
    } catch (e) {
        alert('AIの自動フォーマットに失敗しました。');
    }

    toggleDisableForm(false);
    renderWorksheet();
    editor.focus();
}

function toggleDisableForm(boolean)
{
    qAll('input, textarea, button').forEach(
        (elem) => {
            elem.disabled = boolean;
        }
    );
}

// 解答の表示・非表示切り替え
function toggleAnswer()
{
    document.body.classList.toggle('hide-answers');
    let isHidden = document.body.classList.contains('hide-answers');
    s('toggleAnswerBtn').innerText = isHidden ? '解答を表示' : '解答を隠す';
    renderWorksheet();
}

}

// localStorage 内の保存データを取得
function getSavedSheets()
{
    let list = [];

    for (let i = 0; i < localStorage.length; i++)
    {
        let key = localStorage.key(i);

        if (key && key.startsWith(STORAGE_PREFIX))
        {
            let id = key.slice(STORAGE_PREFIX.length);
            let raw = localStorage.getItem(key);

            try
            {
                let data = JSON.parse(raw || '{}');
                list.push(
                    {
                        id: id,
                        title: data.title || presetTitle,
                        text: data.text || presetText,
                        isEmpty: (!data.title && !data.text)
                    }
                );
            } catch (e) {
                console.error('データの解析に失敗:', key, e);
            }
        }
    }

    // シートの並べ替え（現在のシートも混合）
    list.sort(
        (a, b) => {
            // if (a.id === storageId) return -1;
            // if (b.id === storageId) return 1;
            return a.title.localeCompare(b.title, 'ja');
        }
    );

    return list;
}

// 保存データ管理モーダルを開く
function openStorageModal()
{
    openModal('保存されたシート', '');
    renderStorageList();

    let footer = s('modalFooter');
    footer.innerHTML = '';

    footer.addElem('button',
        {
            className: 'primary',
            innerText: '新規作成',
            onclick: () => {
                createNewSheet();
                closeModal(true);
            }
        }
    );

    footer.addElem('button',
        {
            innerText: '閉じる',
            onclick: () => closeModal(false)
        }
    );
}

// 保存データ一覧をモーダル内に描画
function renderStorageList()
{
    let area = s('modalArea');
    area.innerHTML = '';

    let sheets = getSavedSheets();

    if (sheets.length === 0)
    {
        area.addElem('p',
            {
                innerText: '保存されているシートはありません。',
                style: {
                    textAlign: 'center',
                    color: '#666666',
                    marginTop: '40px'
                }
            }
        );
        return;
    }

    sheets.forEach(
        (item) => {
            let isCurrent = (item.id === storageId);

            let row = area.addElem('div',
                {
                    className: isCurrent ? 'storage-item active' : 'storage-item'
                }
            );

            let info = row.addElem('div',
                {
                    className: 'storage-info'
                }
            );

            let titleEl = info.addElem('p',
                {
                    className: 'storage-title',
                    innerText: item.title || '（無題のシート）'
                }
            );

            if (isCurrent)
            {
                titleEl.addElem('span',
                    {
                        className: 'storage-badge',
                        innerText: '編集中'
                    }
                );
            }

            let previewText = item.text.replace(/\n/g, '\\n').trimCenter(24);
            info.addElem('p',
                {
                    className: 'storage-preview',
                    innerText: previewText || '（本文なし）'
                }
            );

            let actions = row.addElem('div',
                {
                    className: 'storage-actions'
                }
            );

            if (!isCurrent)
            {
                actions.addElem('button',
                    {
                        className: 'primary',
                        innerText: '開く',
                        onclick: () => {
                            // loadSheetData(item.id);
                            location.href = `#${item.id}`;
                            closeModal(true);
                        }
                    }
                );
            }

            actions.addElem('button',
                {
                    className: 'primary',
                    innerText: '複製',
                    onclick: () => {
                        let newId = duplicateWorksheet(item.id);
                        // loadSheetData(newId);
                        location.href = `#${newId}`;
                        closeModal(true);
                    }
                }
            );

            actions.addElem('button',
                {
                    className: 'danger',
                    innerText: '削除',
                    onclick: () => {
                        deleteSavedSheet(item.id, item.title);
                    }
                }
            );
        }
    );
}

function createNewSheet()
{
    let newId = generateSafeKey();
    // loadSheetData(newId);
    location.href = `#${newId}`;
}

function deleteSavedSheet(targetId, targetTitle)
{
    let label = targetTitle || '（無題のシート）';

    if (!confirm(`シート「${label}」を完全に削除しますか？\n※この操作は取り消せません。`))
    {
        return;
    }

    localStorage.removeItem(`${STORAGE_PREFIX}${targetId}`);

    // 現在開いているシートを削除した場合
    if (targetId === storageId)
    {
        let sheets = getSavedSheets();
        let newId = generateSafeKey();

        if (sheets.length !== 0)
        {
            // シートを切り替える
            newId = sheets[0].id;
            loadSheetData(newId);
        }

        // location.href = `#${newId}`;
        setHash(newId);
        closeModal(true);
        return;
    }

    renderStorageList();
}

function openModal(modalTitle, modalHTML)
{
    s('main').setAttribute('inert', '');
    s('modal').style.display = '';
    s('modalText').innerText = (modalTitle || '');
    s('modalArea').innerHTML = (modalHTML || '');

    // デフォルトのフッターボタンを復元
    let footer = s('modalFooter');
    footer.innerHTML = '';
    footer.addElem('button',
        {
            innerText: '確定',
            onclick: () => closeModal(true)
        }
    );
    footer.addElem('button',
        {
            innerText: 'キャンセル',
            onclick: () => closeModal(false)
        }
    );
}

function closeModal(boolean)
{
    s('main').removeAttribute('inert');
    s('modal').style.display = 'none';
}

window.addEventListener('hashchange',
    () => {
        // console.log('URLの遷移を検知しました。');
        loadSheetData(getHash());
        renderStorageList();
    }
);

if ('serviceWorker' in navigator)
{
    window.addEventListener('load',
        () => {
            navigator.serviceWorker.register('/anki_sheet_editor/service-worker.js').then(
                (reg) => console.log('Service Worker 登録成功:', reg.scope)
            ).catch(
                (err) => console.error('Service Worker 登録失敗:', err)
            );
        }
    );
}
</script>
