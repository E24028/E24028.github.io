<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/common.css">
<link rel="icon" type="image/png" href="/anki_sheet_editor/favicon.png">
<link rel="manifest" href="/anki_sheet_editor/manifest.json">
<title>暗記シートエディタ</title>
<style>
body
{
    background: linear-gradient(90deg, lightblue, lightgreen, lightyellow);
}

marquee
{
    font-size: 65vh;
}
</style>
</head>
<body onload="auth()">
<marquee>読み込み中...</marquee>
<script src="https://e24028.github.io/javascript.js"></script>
<script>
let GAS_ID = `https://script.google.com/a/macros/shibaurafzk.com/s/AKfycbzKtyyaE0Xb95OzJBotQ_HVJwYHgMUznmzUPB6fmURbggl3nfw0Z7jDUE9vh01E8qg5sQ/exec?code=${getParams2('code') || ''}&verifier=${getParams2('verifier') || ''}`;

async function auth()
{
    let res1 = await GAS_ID.fetch(
        {
            method: 'GET'
        }
    );

    let json = await res1.json();

    let res2 = await fetch("https://voton.app/api/public/oauth/userinfo",
        {
            headers: { Authorization: `Bearer ${json}` }
        }
    );

    console.log(await res2.json().sub);
}


if ('serviceWorker' in navigator)
{
    window.addEventListener('load',
        () => {
            navigator.serviceWorker.register('/anki_sheet_editor/service-worker.js').then(
                (reg) => console.log('Service Worker 登録成功:', reg.scope)
            ).catch(
                (err) => console.error('Service Worker 登録失敗:', err)
            );
        }
    );
}
</script>
</body>
</html>
