<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ひらがなAAジェネレーター</title>
<style>
html
{
    width: 100%;
    height: 100%;
}

body
{
    font-family: sans-serif;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    overflow: auto;
}

h1
{
    margin-top: 0px;
}

button
{
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 20px;
}

/* AAを表示するエリア：等幅フォント＆行間調整が必須 */
#output
{
    font-family: monospace;
    font-size: 4px;
    /* line-height: 0.85; */
    line-height: 1.0;
    letter-spacing: 0px;
    white-space: pre;
    background-color: #F0F0F0;
    color: #000000;
    /* padding: 15px; */
    padding: 0px;
    /* margin-top: 20px; */
    margin-block: 5px;
    max-width: 100%;
    max-height: calc(100% - 170px);
    overflow: auto;
    display: inline-block;
    user-select: none;
}
</style>
</head>
<body onload="onLoad()">

<h1>ひらがなAAジェネレーター</h1>
<button id="file" onclick="openFile()">画像を開く</button>
<button onclick="exportText()">Export</button>
<button onclick="copyText()">copy</button>
<select id="pxSelect" oninput="savePx()">
    <option value="0.5">0.5px</option>
    <option value="1">1px</option>
    <option value="2">2px</option>
    <option value="3">3px</option>
    <option value="4" selected>4px</option>
    <option value="5">5px</option>
    <option value="6">6px</option>
    <option value="7">7px</option>
    <option value="8">8px</option>
    <option value="9">9px</option>
    <option value="10">10px</option>
    <option value="12">12px</option>
    <option value="15">15px</option>
    <option value="20">20px</option>
</select>
<select id="sizeSelect" oninput="saveSize()">
    <option value="1">1K</option>
    <option value="2">2K</option>
    <option value="4">4K</option>
    <option value="8">8K</option>
    <option value="16" selected>16K</option>
    <option value="32">32K</option>
    <option value="64">64K</option>
    <option value="128">128K</option>
    <option value="256">256K</option>
    <option value="512">512K</option>
    <option value="1024">1M</option>
    <option value="2048">2M</option>
    <option value="4096">4M</option>
</select>
<select id="langSelect" oninput="selectLang()">
    <option value="ja" selected>日本語</option>
    <option value="en">English</option>
</select>
<div id="note">※画像を選択するとここにAAが表示されます⇩</div>
<pre id="output">あいうえお</pre>

<script src="https://e24028.github.io/URL操作.js"></script>
<script src="https://e24028.github.io/Random.js"></script>
<script>
let title = document.querySelector('title');
let defaultTitle = title.innerText;
let langSelect = document.getElementById('langSelect');
let pxSelect = document.getElementById('pxSelect');
let sizeSelect = document.getElementById('sizeSelect');
let h1 = document.querySelector('h1');
let btn = document.getElementById('file');
let note = document.getElementById('note');
let fileName = '';
let fileHandle;
let file;
let lastStatus = {};

// 1. ひらがなマップ（0～255）
const charMap = [
    { threshold: 247, char: "あ" },
    { threshold: 228, char: "お" },
    { threshold: 209, char: "か" },
    { threshold: 190, char: "け" },
    { threshold: 171, char: "き" },
    { threshold: 152, char: "え" },
    { threshold: 133, char: "う" },
    { threshold: 114, char: "い" },
    { threshold: 95,  char: "さ" },
    { threshold: 76,  char: "く" },
    { threshold: 57,  char: "し" },
    { threshold: 38,  char: "こ" },
    { threshold: 19,  char: "｡｡" },
    { threshold: 0,   char: "　" }
];

function onLoad()
{
    langSelect.value = getParams('lang') || 'ja';
    pxSelect.value = getParams('px') || '4';
    sizeSelect.value = getParams('size') || '16';
    saveSize();
    savePx();
    selectLang();
}

function selectLang()
{
    if (langSelect.value === 'ja')
    {
        defaultTitle = 'ひらがなAAジェネレーター';
        h1.innerText = defaultTitle;
        btn.innerText = '画像を開く';
        note.innerText = '※画像を選択するとここにAAが表示されます⇩';
    } else {
        defaultTitle = 'Hiragana ASCII Art Generator';
        h1.innerText = defaultTitle;
        btn.innerText = 'Open an image';
        note.innerText = 'Select an image to preview ASCII art⇩';
        langSelect.value = 'en';
    }

    title.innerText = (fileName === '') ? defaultTitle : `${fileName} - ${defaultTitle}`;
    setParams(['lang', langSelect.value]);
}

function saveSize()
{
    setParams(['size', sizeSelect.value]);

    if (fileHandle)
    {
        renderAA();
    }
}

function savePx()
{
    document.getElementById('output').style.fontSize = `${pxSelect.value}px`;
    setParams(['px', pxSelect.value]);
}

// 輝度（明るさ）から対応するひらがなを返す関数
function getHiragana(brightness)
{
    const darkness = 255 - brightness;
    for (const item of charMap)
    {
        if (darkness >= item.threshold)
        {
            return item.char;
        }
    }

    return "　";
}

function selectedOpt(elem)
{
    return elem.querySelectorAll(`[value="${elem.value}"]`).innerText;
}

async function openFile()
{
    try
    {
        // 例の showOpenFilePicker でファイル選択！
        [fileHandle] = await window.showOpenFilePicker(
            {
                types: [
                    {
                        description: '画像',
                        accept: {
                            'image/*': ['.png', '.jpg', '.jpeg', '.webp']
                        }
                    }
                ],

                id: 'imgFolder',
                startIn: 'downloads'
            }
        );

        file = await fileHandle.getFile();
        await renderAA();
    } catch (err) {
        // キャンセルされた場合などのエラーハンドリング
        if (err.name !== 'AbortError')
        {
            console.error(err);
        }
    }
}

async function renderAA()
{
    try
    {
        lastStatus = {
            px: selectedOpt(pxSelect),
            size: selectedOpt(sizeSelect),
            lang: langSelect.value
        };

        const img = new Image();
        img.src = URL.createObjectURL(file);

        fileName = `${fileHandle.name} ${lastStatus.size}`;
        title.innerText = `${fileName} - ${defaultTitle}`;

        img.onload = () => {
            // AA用に画像を小さくリサイズして描画するCanvasを作成
            // ※文字は縦長になりやすいので、縦を少し縮めるとバランスが良くなります

            // const width = 200; // 横の文字数
            // const scale = width / img.width;
            // const height = Math.floor(img.height * scale); // * 0.5

            let size = img.width * img.height;
            let selectedSize = Number(sizeSelect.value) * 1024;
            let scale = Math.sqrt(size / selectedSize);
            let width = Math.round(img.width / scale);
            let height = Math.round(img.height / scale);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Canvasに縮小描画
            ctx.drawImage(img, 0, 0, width, height);

            // ピクセルデータを取得
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            let aaText = [];

            for (let y = 0; y < height; y++)
            {
                for (let x = 0; x < width; x++)
                {
                    const index = (y * width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];

                    // グレースケール（輝度）計算
                    const brightness = (0.299 * r) + (0.587 * g) + (0.114 * b);

                    // ひらがなに変換して追加
                    aaText.push(getHiragana(brightness));
                }

                aaText.push('\n'); // 改行
            }

            // 画面に出力
            document.getElementById('output').textContent = aaText.join('');
        };
    } catch (err) {
        // キャンセルされた場合などのエラーハンドリング
        if (err.name !== 'AbortError')
        {
            console.error(err);
        }
    }
}

function copyText()
{
    let output = document.getElementById('output');
    navigator.clipboard.writeText(output.innerText);
    alert('copied!');
}

function exportText()
{
    let output = document.getElementById('output');

    if (!fileHandle)
    {
        alert('Please upload an image.');
        return;
    }

    let storageName = `AA ${fileName}`;
    localStorage.setItem(`data: ${storageName}`, output.innerText);

    window.open(`https://e24028.github.io/テキストエディター2.html?select=${storageName}&fontSize=${selectedOpt(pxSelect)}&darkmode=false`);
}
</script>
</body>
</html>
