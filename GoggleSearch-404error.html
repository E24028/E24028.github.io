<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<link rel="stylesheet" href="codepre.css">
<meta name="viewport" content="initial-scale=1, minimum-scale=1, width=device-width">
<title>Error 404 (Not Found)!!1</title>
<style>
*
{
    margin: 0px;
    padding: 0px;
}

html, code
{
    font: 15px/22px arial, sans-serif;
}

html
{
    background: #fff;
    color: #222;
    padding: 15px;
}

body
{
    margin: 7% auto 0px;
    max-width: 390px;
    min-height: 180px;
    padding: 30px 0 15px;
}

* > body
{
    background: url(/24403.png) 100% 5px no-repeat;
    padding-right: 240px;
    background-size: contain;
}

p
{
    margin: 11px 0 22px;
    overflow: hidden;
}

ins
{
    color: #777;
    text-decoration: none;
}

a img
{
    border: 0px;
}

@media screen and (max-width:772px)
{
    body
    {
        background: none;
        margin-top: 0px;
        max-width: none;
        padding-right: 0px;
    }
}

#logo
{
    background: url(/Goggle.svg) no-repeat;
    background-size: contain;
    margin-left: -5px;
}

#logob
{
    background: url(/Goggle_logo_bug-error.png) no-repeat;
    background-size: contain;
    margin-left: -5px;
    display:inline-block;
    width:150px;
    height:54px;
}

@media only screen and (min-resolution:192dpi)
{
    #logo
    {
        background: url(/Goggle.svg) no-repeat 0% 0%/100% 100%;
        background-size: contain;
        -moz-background-size: contain;
        -moz-border-image: url(/Goggle.svg) 0px;
    }

    #logob
    {
        background: url(/Goggle_logo_bug-error.png) no-repeat 0% 0%/100% 100%;
        background-size: contain;
        -moz-background-size: contain;
        -moz-border-image: url(/Goggle_logo_bug-error.png) 0px;
        display:inline-block;
        width:150px;
        height:54px;
    }
}

@media only screen and (-webkit-min-device-pixel-ratio:2)
{
    #logo
    {
        background:url(/Goggle.svg) no-repeat;
        background-size: contain;
        -webkit-background-size:100% 100%;
    }
    
    #logo
    {
        background:url(/Goggle_logo_bug-error.png) no-repeat;
        background-size: contain;
        -webkit-background-size:100% 100%;
        display:inline-block;
        width:150px;
        height:54px;
    }
}

#logo
{
    display: inline-block;
    height: 54px;
    width: 150px;
}
</style>
</head>
<body onload="onLoad()">
<a href="https://e24028.github.io/Goggle検索.html">
    <span id="logo" aria-label="Goggle"></span>
</a>
<p>
    <b>404.</b>
    <ins>That’s an error.</ins>
</p>
<p>The requested URL
    <code>/404</code>
was not found on this server.
    <ins>That’s all we know.</ins>
</p>

<script>
function onLoad()
{
    // プリロード
    const img = new Image();
    img.src = '/25661531.png';

    // ブラー
    const transitionStyle = document.createElement('style');
    transitionStyle.innerText = `
        html
        {
            transition: filter 0.5s ease-in-out;
        }

        .apply-blur
        {
            filter: blur(20px) !important;
        }
    `;
    document.head.appendChild(transitionStyle);

    // 変更
    setTimeout(
        () => {
            document.documentElement.classList.add('apply-blur');

            // CSS変更ブラー解除
            setTimeout(
                () => {
                    // ロゴ要素のID変更
                    const logoEl = document.getElementById('logo');
                    if (logoEl)
                    {
                        logoEl.id = 'logob';
                    }

                    let styleTag = document.getElementById('custom-bg-style');

                    if (!styleTag)
                    {
                        styleTag = document.createElement('style');
                        styleTag.id = 'custom-bg-style';
                        document.head.appendChild(styleTag);
                    }

                    styleTag.innerText = `
                        body
                        {
                            background: white !important;
                        }

                        html
                        {
                            background: url(/25661531.png) !important;
                            background-size: contain !important;
                        }
                    `;

                    // ブラーを徐々に解除
                    document.documentElement.classList.remove('apply-blur');
                }, 500
            );
        }, 3000
    );
}
</script>
</body>
</html>
