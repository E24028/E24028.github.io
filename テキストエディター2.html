<!DOCTYPE html>
<html id="root" darkmode="false">
<head>
<title id="title">テキストエディター2</title>
<link rel="icon" href="https://e24028.github.io/Icon HTMLmaker.jpg">
<style>
html
{
    width: 100%;
    height: 100%;
    background-color: var(--bg-color);
}

body
{
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    margin: 8px;
    overflow: auto;
}

html[darkmode="false"]
{
    --color: rgb(0, 0, 0);
    --bg-color: rgb(255, 255, 255);
    --left-color: rgb(255, 255, 191);
    --right-color: rgb(240, 250, 250);
    --button-border: rgb(127, 127, 127);
    --button-border-selected: rgb(98, 98, 98);
    --button-bgcolor: rgb(239, 239, 239);
    --button-bgselected: rgb(190, 190, 190);
}

html[darkmode="true"]
{
    --color: rgb(255, 255, 255);
    --bg-color: rgb(0, 0, 0);
    --left-color: rgb(36, 36, 0);
    --right-color: rgb(20, 61, 61);
    --button-border: rgb(127, 127, 127);
    --button-border-selected: rgb(155, 155, 155);
    --button-bgcolor: rgb(16, 16, 16);
    --button-bgselected: rgb(65, 65, 65);
}

.container
{
    display: flex;
    height: 100%;
}

#Left
{
    width: 30%;
    border-width: 0px 3px 0px 0px;
    border-style: solid;
    border-color: rgb(127, 127, 127);
    background-color: var(--left-color);
    overflow-y: scroll;
}

#Right
{
    width: 70%;
    background-color: var(--right-color);
}

#titleText
{
    height: 50px;
    font-size: 30px;
    text-align: center;
}

#menu
{
    height: 40px;
    overflow-y: scroll;
}

#box
{
    height: calc(100% - 90px);
}

textarea
{
    width: calc(100% - 6px);
    height: calc(100% - 6px);
    resize: none;
    font-size: 20px;
    line-height: 1.0;
}

iframe
{
    width: calc(100% - 2px);
    height: calc(100% - 2px);
}

textarea[fullscreen]
{
    /* width: 100vw; */
    /* height: 100vh; */
    /* position: fixed; */
    /* top: 0px; */
    /* left: 0px; */
    /* z-index: 7777; */
}

#Add
{
    width: calc(100% - 70px);
}

#Rename
{
    width: calc(100% - 110px);
}

#Reproduct
{
    width: calc(100% - 70px);
}

#Select
{
    width: calc(100% - 20px);
}

#Select2
{
    width: calc(100% - 75px);
}

input[type="text"], select
{
    min-width: 100px;
}

span, #titleText, #or
{
    color: var(--color);
}

select, input[type="text"], textarea, iframe
{
    color: var(--color);
    background-color: var(--bg-color);
    border: 1px solid rgb(127, 127, 127);
}

#LeftBox, #RightBox
{
    width: 100%;
    height: 100%;
}

#RightBox
{
    display: none;
}

#box[wide]
{
    flex-direction: row;
}

#box[high]
{
    flex-direction: column;
}

.new::before
{
    content: "NEW(β版)";
    font-size: 10px;
    color: white;
    background-color: rgb(0, 0, 255);
    border-radius: 10px;
    padding: 0px 5px;
}

button
{
    border: 1px solid var(--button-border);
    border-radius: 3px;
    background-color: var(--button-bgcolor);
    color: var(--color);
}
    
button:hover, button:focus
{
    border: 1px solid var(--button-border-selected);
    background-color: var(--button-bgselected);
}
</style>
</head>
<body onload="onLoad()" onkeydown="key(event)" onstorage="onStorage()">
<div class="container">
    <div id="Left">
        <span>ファイルを開く</span>
        <div>
            <select id="Select" oninput="onSelect()"></select>
        </div>
        <p></p>

        <span>新規作成</span>
        <div>
            <input type="text" id="Add" placeholder="追加するファイルのタイトルを入力..." onkeydown="key(event, this)">
            <button onclick="ADD()" id="AddBtn">追加</button>
            <div id="or">--- または ---</div>
            <button onclick="upload()">アップロード</button>
        </div>
        <p></p>

        <span>削除</span>
        <div>
            <button onclick="DELETE()">選択されたファイルを削除</button>
        </div>
        <p></p>

        <span>名前の変更・複製</span>
        <div>
            <input type="text" id="Rename" placeholder="変更後のタイトルを入力..." onkeydown="key(event, this)">
            <button onclick="RENAME()" id="RenameBtn">名前を変更</button>
        </div>
        <div>
            <input type="text" id="Reproduct" placeholder="複製先のタイトルを入力..." onkeydown="key(event, this)">
            <button onclick="REPRODUCT()" id="ReproductBtn">複製</button>
        </div>
        <p></p>

        <span>外部連携</span>
        <div>
            <select id="Select2">
                <option selected>暗号化</option>
                <option>リアルタイム HTML メーカー</option>
                <option>html表示</option>
                <option>URLパラメータ2</option>
                <option>URLパラメーター試験用</option>
                <option>URL エンコーダー&デコーダー</option>
                <option>テキスト表示</option>
                <option>構文ハイライトGemini</option>
                <option>ハイライト実験</option>
                <option>title</option>
                <option>markdown</option>
            </select>
            <button onclick="OPEN()">で開く</button>
        </div>
        <p></p>

        <span class="new">JSONデータ管理</span>
        <div class="json-tool">
            <button onclick="saveJSON()">全データをJSON保存</button>
            <button onclick="loadJSON()">JSONをロード</button>
        </div>
        <p></p>

        <a href="https://shizukani-cp.github.io/htmlapps/memo" target="_blank" rel="noopener">友達が作ったメモアプリの紹介</a>
    </div>
    <div id="Right">
        <div id="titleText">テキストエディター</div>

        <div id="menu">
            <button onclick="copy()">コピー</button>
            <button onclick="download()" id="saveBtn">保存</button>
            <button onclick="dark()">ダーク/ライト切り替え</button>
            <select oninput="setFontSize()" id="fontSize">
                <option>1px</option>
                <option>2px</option>
                <option>3px</option>
                <option>5px</option>
                <option>10px</option>
                <option>15px</option>
                <option selected>20px</option>
                <option>30px</option>
                <option>40px</option>
                <option>50px</option>
                <option>75px</option>
                <option>100px</option>
                <option>150px</option>
                <option>200px</option>
            </select>
            <span id="lengthDisplay"></span>
        </div>

        <div id="box" class="container" wide>
            <div id="LeftBox">
                <textarea id="Input" oninput="onInput()" placeholder="入力..."></textarea>
            </div>
            <div id="RightBox"></div>
        </div>
    </div>
</div>

<script src="https://e24028.github.io/javascript.js"></script>
<script>
const PREFIX = "data: ";

let select = s('Select');
let select2 = s('Select2');
let input = s('Input');
let add = s('Add');
let rename = s('Rename');
let reproduct = s('Reproduct');
let root = s('root');
let TITLE = s('title');
let fontSize = s('fontSize');
let defaultTitle = TITLE.innerText;
let lengthDisplay = s('lengthDisplay');

// ストレージから対象のデータ（タイトル）一覧を取得
function getTitles()
{
    let titles = [];
    for (let i = 0; i < localStorage.length; i++)
    {
        const key = localStorage.key(i);

        if (key && key.startsWith(PREFIX))
        {
            titles.push(key.slice(PREFIX.length));
        }
    }
    return titles;
}

function updateSelectList(selectedTitle)
{
    const titles = getTitles();

    // リストを一旦空にする
    select.innerHTML = "";

    // タイトルがない場合は「無題」を作成
    if (titles.length === 0)
    {
        localStorage.setItem(PREFIX + "無題", "");
        titles.push("無題");
    }

    // ソート
    titles.newSort();

    titles.forEach(
        title => {
            let option = document.createElement('option');
            option.value = title;
            option.innerText = title;

            if (title === selectedTitle)
            {
                option.selected = true;
            }

            select.appendChild(option);
        }
    );

    setParams2(['select', select.value]);
    TITLE.innerText = `${select.value} - ${defaultTitle}`;

    getLength();
}

function onLoad()
{
    let params = getParams2('select') || null;
    updateSelectList(params);
    onSelect(); // 初期表示の読み込み
    root.setAttribute('darkmode', getParams2('darkmode') || 'false');

    fontSize.value = getParams2('fontSize') || '20px';
    setFontSize();
}

function onStorage()
{
    console.log('データが更新されました。再読み込みします。');
    onLoad();
}

function onInput()
{
    const currentTitle = select.value;

    if (currentTitle)
    {
        localStorage.setItem(PREFIX + currentTitle, input.value);
    }

    updateSelectList(select.value);
}

function onSelect()
{
    const currentTitle = select.value;
    const data = localStorage.getItem(PREFIX + currentTitle);
    input.value = data || ""; // data ? data : ""; (？)
    updateSelectList(select.value);
}

function ADD()
{
    const newTitle = add.value; // .trim();

    if (newTitle === "")
    {
        alert("タイトルを入力してください");
        return;
    }

    if (localStorage.getItem(PREFIX + newTitle) !== null)
    {
        alert(`そのタイトルは既に存在します: ${newTitle}`);
        return;
    }

    localStorage.setItem(PREFIX + newTitle, "");
    add.value = ""; // 入力欄をクリア
    updateSelectList(newTitle); // 新規追加したものを選択状態にする
    onSelect();
}

function DELETE()
{
    if (confirm(`本当に削除しますか？: ${select.value}`))
    {
        localStorage.removeItem(PREFIX + select.value);
        updateSelectList();
        onSelect();
        alert('削除しました');
    }
}

function copy()
{
    clipboard(input.value);
}

// 新規ファイルとして保存する関数
async function download()
{
    console.log('ファイルを保存中...');

    try
    {
        let fileHandle = await window.showSaveFilePicker(
            {
                startIn: 'downloads',
                suggestedName: `${select.value || '無題'}`
            }
        );

        const writable = await fileHandle.createWritable();
        await writable.write(input.value);
        await writable.close();
        console.log('ファイルが正常に保存されました。');
    } catch (error) {
        console.warn('ファイルの保存に失敗しました: ' + error);
    }
}

// ファイルを読み込む関数
async function upload()
{
    console.log('ファイルを読み込み中...');

    try
    {
        let [fileHandle] = await window.showOpenFilePicker(
            {
                startIn: 'downloads'
            }
        );

        let newTitle = fileHandle.name;
        const file = await fileHandle.getFile();
        const content = await file.text();
        console.log('ファイルを正常に読み込みました。');

        if (localStorage.getItem(PREFIX + newTitle) !== null)
        {
            alert("そのタイトルは既に存在します。");
        } else {
            localStorage.setItem(PREFIX + newTitle, "");
            updateSelectList(newTitle); // 新規追加したものを選択状態にする
            onSelect();
            input.value = content; // 入力欄を設定
            onInput();
        }
    } catch (error) {
        console.warn('ファイルの読み込みに失敗しました: ' + error);
    }
}

// --- JSONセーブ・ロード機能 ---
function saveJSON()
{
    if (confirm('JSONとして保存しますか？'))
    {
        const allData = {};
        for (let i = 0; i < localStorage.length; i++)
        {
            const key = localStorage.key(i);
            if (key.startsWith(PREFIX))
            {
                allData[key] = localStorage.getItem(key);
            }
        }

        const jsonStr = JSON.stringify(allData, null, 4);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `${prompt('ファイル名を入力…') || '無題'}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }
}

async function loadJSON()
{
    try
    {
        let [fileHandle] = await window.showOpenFilePicker(
            {
                types: [
                    {
                        startIn: 'downloads',
                        description: 'JSON ファイル',
                        accept: { 'application/json': ['.json'] }
                    }
                ]
            }
        );
        const file = await fileHandle.getFile();
        const content = await file.text();
        const data = JSON.parse(content);

        if (confirm("データをインポートしますか？（同名のファイルは上書きされます）"))
        {
            Object.keys(data).forEach(
                key => {
                    if (key.startsWith(PREFIX))
                    {
                        localStorage.setItem(key, data[key]);
                    }
                }
            );
            updateSelectList();
            onSelect();
            alert("インポートが完了しました");
        }
    } catch (error) {
        alert("JSONの読み込みに失敗しました。書式を確認してください。");
        console.error(error);
    }
}

function key(event, element)
{
    if (event.key === "s" && event.ctrlKey)
    {
        event.preventDefault();
        s('saveBtn').click();
    }

    if (event.key === "Enter" && element)
    {
        event.preventDefault();

        let id = element.id + 'Btn';
        s(id).click();
    }
}

function RENAME()
{
    const oldTitle = select.value;

    if (!oldTitle)
    {
        alert('ファイルを新規作成してください');
        return;
    }

    const newTitle = rename.value;

    if (newTitle === '') // .trim()
    {
        alert('変更後のタイトルを入力してください。');
        return;
    }

    if (newTitle === oldTitle)
    {
        alert(`元のタイトルと同じです: ${newTitle}`);
        return;
    }

    if (localStorage.getItem(PREFIX + newTitle) !== null)
    {
        alert(`そのタイトルは既に存在します: ${newTitle}`);
        return;
    }

    rename.value = ""; // 入力欄をクリア

    // データの移行
    const data = localStorage.getItem(PREFIX + oldTitle);
    localStorage.setItem(PREFIX + newTitle, data);
    localStorage.removeItem(PREFIX + oldTitle);

    updateSelectList(newTitle);
    onSelect();
    alert("ファイル名を変更しました。");
}

function REPRODUCT()
{
    const oldTitle = select.value;

    if (!oldTitle)
    {
        alert('ファイルを新規作成してください');
        return;
    }

    const newTitle = reproduct.value;

    if (newTitle === '') // .trim()
    {
        alert('複製先のタイトルを入力してください。');
        return;
    }

    if (newTitle === oldTitle)
    {
        alert(`元のタイトルと同じです: ${newTitle}`);
        return;
    }

    if (localStorage.getItem(PREFIX + newTitle) !== null)
    {
        alert(`そのタイトルは既に存在します: ${newTitle}`);
        return;
    }

    reproduct.value = ""; // 入力欄をクリア

    // データの移行
    const data = localStorage.getItem(PREFIX + oldTitle);
    localStorage.setItem(PREFIX + newTitle, data);
    // localStorage.removeItem(PREFIX + oldTitle);

    updateSelectList(newTitle);
    onSelect();
    alert("ファイルを複製しました。");
}

function OPEN()
{
    let text = input.value;
    let encoded = encodeURIComponent(text);
    let url = encoded.replace(/%20/g, '+');
    let data = select2.value;

    let paramMap = {
        '暗号化' : 'data',
        'リアルタイム HTML メーカー' : 'html',
        'html表示' : 'html',
        'URLパラメータ2' : 'key',
        'URLパラメーター試験用' : 'text',
        'URL エンコーダー&デコーダー' : 'text',
        'テキスト表示' : 'text',
        '構文ハイライトGemini' : 'data',
        'ハイライト実験' : 'code',
        'title' : 'name',
        'markdown' : 'markdown'
    };
    let params = paramMap[data];

    window.open(`https://e24028.github.io/${select2.value}.html?${params}=${url}`);
}

function dark()
{
    let mode = (root.getAttribute('darkmode') === 'true') ? 'false' : 'true';
    root.setAttribute('darkmode', mode);
    setParams2(['darkmode', mode]);
}

function setFontSize()
{
    input.style.fontSize = fontSize.value;
    setParams2(['fontSize', fontSize.value]);
}

function getLength()
{
    let length = input.value.length;
    let arrayLength = input.value.split('\n').length;
    let bytes = (input.value.encode().length / 3);
    let byteDisplay = `${bytes} B`;

    if (bytes >= 1024) byteDisplay = `${(bytes / 1024).toFixed(3)} KB`;
    if (bytes >= 1048576) byteDisplay = `${(bytes / 1048576).toFixed(3)} MB`;
    if (bytes >= 1073741824) byteDisplay = `${(bytes / 1073741824).toFixed(3)} TB`;

    lengthDisplay.innerText = `${length} 文字、${arrayLength} 行、${byteDisplay}`;
}
</script>
</body>
</html>
