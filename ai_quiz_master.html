<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Master - AIクイズ生成 & 採点アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 外部 JavaScript ライブラリ -->
    <script src="https://e24028.github.io/javascript.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
        }
        .animate-spin-fast {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden transition-colors duration-200">

<header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shrink-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-brain text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">AI Quiz Master</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">AI自動問題生成 & 記述自動採点</p>
            </div>
        </div>

        <!-- 連続日数 (Streak) バッジ & ダークモード切り替え -->
        <div class="flex items-center space-x-3">
            <div id="streakBadge" class="flex items-center bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 px-3 py-1.5 rounded-full text-amber-700 dark:text-amber-400 font-semibold text-sm shadow-xs">
                <i class="fa-solid fa-fire text-amber-500 mr-1.5 animate-bounce"></i>
                <span id="streakCountText">0</span>日連続
            </div>
            <button id="themeToggleBtn" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <!-- タブナビゲーション -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex border-t border-slate-100 dark:border-slate-700/50">
        <!-- サイドパネルトグルボタン -->
        <button id="sidebarToggleBtn" onclick="toggleSidebar()" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition flex items-center gap-1.5 text-sm font-medium" title="保存済みクイズ一覧">
            <span style="font-size: 20px;">≡</span>
        </button>

        <button id="tabGenBtn" onclick="switchTab('generate')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>クイズ生成</span>
        </button>
        <button id="tabPlayBtn" onclick="switchTab('play')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-gamepad"></i>
            <span>クイズ実施</span>
            <span id="playBadge" class="hidden w-2 h-2 rounded-full bg-blue-500"></span>
        </button>
        <button id="tabHistBtn" onclick="switchTab('history')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>履歴</span>
        </button>
    </div>
</header>

<div class="flex-1 flex max-w-7xl w-full mx-auto relative overflow-hidden h-full min-h-0">

    <!-- サイドパネル（保存済みクイズセット一覧） -->
    <aside id="sidebar" class="w-80 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-all duration-300 absolute md:relative z-20 h-full -translate-x-full md:translate-x-0 shrink-0 shadow-lg md:shadow-none">
        <div class="p-4 border-b border-slate-100 dark:border-slate-700/60 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-blue-600 dark:text-blue-400"></i>
                    <span>保存済みクイズセット</span>
                </h2>
                <span id="savedSetCount" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">0件</span>
            </div>

            <!-- 検索 & ソートフォーム -->
            <div class="space-y-2">
                <div class="relative">
                    <input type="text" id="sidebarSearchInput" oninput="renderSidebarQuizList()" placeholder="タイトルやタグで検索..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs" style="top: 6px;"></i>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-[11px] text-slate-500 shrink-0">
                        <i class="fa-solid fa-arrow-down-wide-short mr-1"></i>並べ替え：
                    </label>
                    <select id="sidebarSortSelect" onchange="renderSidebarQuizList()" class="w-full text-xs py-1 px-2 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
                        <option value="title_asc">題名：小さい順</option>
                        <option value="title_desc">題名：大きい順</option>
                        <option value="created_desc">作成日時：新しい順</option>
                        <option value="created_asc">作成日時：古い順</option>
                        <option value="length_desc">問題数：長い順</option>
                        <option value="length_asc">問題数：短い順</option>
                        <option value="status">進捗度順</option>
                        <option value="difficulty">難易度順</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="sidebarQuizList" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- 保存済みクイズセットカードが動的に挿入されます -->
        </div>

        <div class="p-3 border-t border-slate-100 dark:border-slate-700/60 bg-slate-50 dark:bg-slate-800/50">
            <button onclick="switchTab('generate')" class="w-full py-2.5 px-3 text-xs font-semibold text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-xl border border-blue-200 dark:border-blue-800 transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>新しいクイズを作成</span>
            </button>
        </div>
    </aside>

    <!-- オーバーレイ -->
    <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-10 hidden md:hidden"></div>

    <main class="flex-1 p-4 sm:p-6 overflow-y-auto h-full" style="/* padding-bottom: 0px; */">

        <!-- TAB 1：クイズ生成画面 -->
        <section id="viewGenerate" class="space-y-6">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
                <div class="mb-6">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-blue-600 dark:text-blue-400"></i>
                        <span>クイズの設定</span>
                    </h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                        学びたいトピックを入力すると、AIが即座に最適化された問題セットを作成します。
                    </p>
                </div>

                <form onsubmit="handleGenerateQuiz(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">題名</label>
                            <input type="text" id="topicInput" required placeholder="例：二次方程式確認クイズ" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">カスタム重点分野（任意）</label>
                            <input type="text" id="topicInput2" placeholder="例：解の公式と放物線グラフ" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">問題数（1～20問）</label>
                            <input type="number" id="countSelect" placeholder="問題数" value="5" min="1" max="20" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">出題形式</label>
                            <select id="typeSelect" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                                <option value="mixed" selected>混合（選択式 + 記述式）</option>
                                <option value="choice">選択式（4択）のみ</option>
                                <option value="text">記述式（AI自動採点）のみ</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">難易度</label>
                            <select id="difficultySelect" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                                <option value="初級">初級（基礎・基本)</option>
                                <option value="中級" selected>中級（標準レベル）</option>
                                <option value="上級">上級（応用・発展)</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="genSubmitBtn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold shadow-md flex items-center justify-center gap-2 transition active:scale-[0.99]">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>生成開始！</span>
                    </button>
                </form>
            </div>

            <!-- おすすめプリセット -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
                <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">クイックプリセット</h3>
                <div class="flex flex-wrap gap-2">
                    <!-- IT系 -->
                    <button onclick="setTopicPreset('Python基礎文法', '変数・条件分岐・ループ')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🐍 Python基礎文法</button>
                    <button onclick="setTopicPreset('JavaScript基本操作', 'DOM操作・配列メソッド')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">⚡ JavaScript基本</button>
                    <button onclick="setTopicPreset('Excel基本関数', 'AVERAGE・SUM・IFERROR')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">√ Excel関数</button>
                    <button onclick="setTopicPreset('ITパスポート基本用語', 'セキュリティ・ネットワーク')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">💻 ITパスポート</button>
                    <button onclick="setTopicPreset('SQLデータベース基本', 'SELECT文とJOIN')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🗄️ SQL基本操作</button>

                    <!-- 語学・資格 -->
                    <button onclick="setTopicPreset('日常英会話フレーズ', '旅行・レストランで使える表現')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🗣️ 日常英会話</button>
                    <button onclick="setTopicPreset('TOEIC頻出英単語', 'ビジネス単語・イディオム')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🇬🇧 TOEIC単語</button>
                    <button onclick="setTopicPreset('ビジネス敬語マナー', 'メール作成・電話対応')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">👔 ビジネス敬語</button>

                    <!-- 教養・学問 -->
                    <button onclick="setTopicPreset('世界史の主要な出来事', '産業革命・二つの世界大戦')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🌍 世界史常識</button>
                    <button onclick="setTopicPreset('日本の歴史（戦国〜江戸）', '織田信長・徳川家康の政策')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🏯 日本史（戦国・江戸）</button>
                    <button onclick="setTopicPreset('高校数学・二次関数', '頂点の座標・判別式')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">📐 数学（二次関数）</button>

                    <!-- 雑学・エンタメ -->
                    <button onclick="setTopicPreset('科学常識・身近な疑問', '光合成・元素記号・物理法則')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🧪 科学・理科常識</button>
                    <button onclick="setTopicPreset('世界の国旗と首都', 'アジア・ヨーロッパの国々')" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm transition">🗺️ 世界の国旗・首都</button>
                </div>
            </div>
        </section>

        <!-- TAB 2：クイズ解答画面 -->
        <section id="viewPlay" class="hidden space-y-6">
            <!-- 未生成時メッセージ -->
            <div id="noQuizAlert" class="bg-white dark:bg-slate-800 rounded-2xl p-12 text-center border border-slate-200 dark:border-slate-700">
                <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-file-circle-question"></i>
                </div>
                <h3 class="text-lg font-bold mb-2">選択されたクイズがありません</h3>
                <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">「クイズ生成」タブから新しく作成するか、左側のメニューからクイズを選択してください。</p>
                <button onclick="switchTab('generate')" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition">
                    <span>クイズ生成画面へ</span>
                </button>
            </div>

            <!-- クイズ解答カード -->
            <div id="quizContainer" class="hidden space-y-6">
                <!-- 進捗バーとヘッダー -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="flex items-center justify-between mb-3">
                        <span id="quizTopicBadge" class="text-xs font-semibold px-3 py-1 bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300 rounded-full"></span>
                        <span id="quizSubject"></span>
                        <span class="text-sm font-semibold text-slate-500 dark:text-slate-400">
                            問題 <span id="currentQNum" class="text-blue-600 dark:text-blue-400 font-bold">1</span> / <span id="totalQNum">5</span>
                        </span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 20%;"></div>
                    </div>
                </div>

                <!-- 問題エリア -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
                    <div>
                        <span id="questionTypeBadge" class="inline-block px-2.5 py-0.5 text-xs font-semibold rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 mb-2"></span>
                        <h3 id="questionText" class="text-lg font-bold leading-relaxed"></h3>
                    </div>

                    <!-- 選択肢コンテナ (選択式) -->
                    <div id="optionsContainer" class="space-y-3"></div>

                    <!-- テキスト入力 (記述式) -->
                    <div id="textInputContainer" class="hidden space-y-2">
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400">あなたの解答を入力してください：</label>
                        <textarea id="textAnswerInput" rows="4" placeholder="ここに回答を詳しく記述してください..." class="w-full p-4 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition" spellcheck="false"></textarea>
                    </div>

                    <!-- 操作ボタン -->
                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-700/60">
                        <button id="prevQBtn" onclick="navigateQuestion(-1)" class="px-4 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl font-medium transition disabled:opacity-40">
                            <i class="fa-solid fa-arrow-left mr-1"></i>
                            <span>戻る</span>
                        </button>
                        <button id="nextQBtn" onclick="navigateQuestion(1)" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition flex items-center gap-2">
                            <span>次へ</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <button id="submitQuizBtn" onclick="submitAnswersAndGrade()" class="hidden px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl shadow-md transition flex items-center gap-2">
                            <span>✓</span>
                            <span>採点する</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 3：履歴ダッシュボード -->
        <section id="viewHistory" class="hidden space-y-6">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold">履歴</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">クイズの挑戦履歴や過去の解答結果を確認できます。同じ問題を繰り返し解いた場合も記録されます。</p>
                </div>
                <button onclick="clearHistory()" class="px-3.5 py-2 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-xl text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>履歴クリア</span>
                </button>
            </div>

            <div id="historyList" class="space-y-4" style="height: calc(100vh - 285px); overflow: auto;">
                <!-- JSで動的に追加 -->
            </div>
        </section>

    </main>
</div>

<!-- AI思考中モーダル -->
<div id="loadingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl text-center space-y-4 border border-slate-200 dark:border-slate-700">
        <div class="relative w-16 h-16 mx-auto">
            <div class="absolute inset-0 rounded-full border-4 border-blue-200 dark:border-blue-900"></div>
            <div class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
            <i class="fa-solid fa-robot absolute inset-0 flex items-center justify-center text-blue-600 dark:text-blue-400 text-xl"></i>
        </div>
        <div>
            <h3 id="loadingTitle" class="font-bold text-lg">AIが思考中...</h3>
            <p id="loadingSubtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-1">問題を生成しています。少々お待ちください。</p>
        </div>
    </div>
</div>

<!-- 採点結果ダイアログモーダル -->
<div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4 overflow-y-auto">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full my-8 shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col max-h-[90vh]">
        <div class="p-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-center relative flex-shrink-0">
            <button onclick="closeResultModal()" class="absolute top-4 right-4 text-white/80 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold mb-2">採点完了</div>
            <h2 class="text-3xl font-black mb-1"><span id="resultScore">0</span> / 100 点</h2>
            <p id="resultComment" class="text-sm text-blue-100 font-medium"></p>
        </div>

        <div id="resultDetailsContainer" class="p-6 overflow-y-auto space-y-6 flex-1"></div>

        <div class="p-4 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 flex justify-end flex-shrink-0">
            <button onclick="closeResultModal()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition">
                閉じる
            </button>
        </div>
    </div>
</div>

<script>
/* -------------------------------------------------------------
    * アプリケーション状態変数
    * ------------------------------------------------------------- */
let quizSets = []; // 保存されたすべてのクイズセット
let currentQuizData = null; // 現在選択・挑戦中のクイズデータ
let userAnswers = {}; // ユーザーの回答データ { [qIndex]: answerString }
let currentQuestionIdx = 0; // 現在表示している問題のインデックス
let isSidebarOpen = true; // サイドパネルの開閉状態

/* タブと数値インデックスのマッピング */
let TAB_INDEX_MAP = {
    'generate': 1,
    'play': 2,
    'history': 3
};

let INDEX_TAB_MAP = {
    1: 'generate',
    2: 'play',
    3: 'history'
};

/* -------------------------------------------------------------
    * ランダムIDおよびURLハッシュ(7桁)管理
    * ------------------------------------------------------------- */
function generate6DigitId() {
    let mapStr = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRTSUVWXYZ';
    let str1 = mapStr[getRandom2(0, 61)];
    let str2 = mapStr[getRandom2(0, 61)];
    let str3 = mapStr[getRandom2(0, 61)];
    let str4 = mapStr[getRandom2(0, 61)];
    let str5 = mapStr[getRandom2(0, 61)];
    let str6 = mapStr[getRandom2(0, 61)];
    return (str1 + str2 + str3 + str4 + str5 + str6);
}

function getCurrentQuizRandId() {
    if (currentQuizData && currentQuizData.randId) {
        return currentQuizData.randId;
    }
    return 'xxxxxx';
}

function updateHashWithTab(tabName) {
    let currentTab = tabName || getCurrentActiveTab();
    let tabIdx = (TAB_INDEX_MAP[currentTab] !== undefined) ? TAB_INDEX_MAP[currentTab] : '1';
    let quizRandId = getCurrentQuizRandId();
    let hashVal = tabIdx + quizRandId;
    setHash(hashVal);
}

function getCurrentActiveTab() {
    if (!s('viewGenerate').classList.contains('hidden')) return 'generate';
    if (!s('viewPlay').classList.contains('hidden')) return 'play';
    if (!s('viewHistory').classList.contains('hidden')) return 'history';
    return 'generate';
}

function restoreStateFromHash() {
    let hash = getHash();
    if (hash && hash.length === 7) {
        let tabIdx = Number(hash[0]);
        let quizRandId = hash.substring(1, 7);

        let targetTab = INDEX_TAB_MAP[tabIdx] || 'generate';

        if (quizSets && quizSets.length > 0) {
            let found = quizSets.find(q => q.randId === quizRandId);
            if (found) {
                selectQuizSet(found.id, false, false);
            }
        }
        return targetTab;
    }
    return null;
}

/* -------------------------------------------------------------
    * 初期化処理
    * ------------------------------------------------------------- */
window.addEventListener('DOMContentLoaded', () => {
    initStreak();
    loadAllQuizSets(false); // 初期化時はハッシュを自動上書きしない
    renderHistoryList();
    setupTheme();

    // ハッシュ値から初期状態を取得。なければデフォルトで 'generate'
    let initialTab = restoreStateFromHash() || 'generate';
    switchTab(initialTab, true);

    if (window.innerWidth < 768) {
        toggleSidebar(false);
    }
});

/* -------------------------------------------------------------
    * タブ切り替え処理 (URLハッシュ連携含む)
    * ------------------------------------------------------------- */
function switchTab(tabName, updateHash = true) {
    let views = {
        generate: s('viewGenerate'),
        play: s('viewPlay'),
        history: s('viewHistory')
    };

    let btns = {
        generate: s('tabGenBtn'),
        play: s('tabPlayBtn'),
        history: s('tabHistBtn')
    };

    Object.keys(views).forEach(key => {
        if (views[key]) {
            if (key === tabName) {
                views[key].classList.remove('hidden');
            } else {
                views[key].classList.add('hidden');
            }
        }

        if (btns[key]) {
            if (key === tabName) {
                btns[key].className = 'tab-btn px-4 py-3 text-sm font-medium border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 flex items-center gap-2';
            } else {
                btns[key].className = 'tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 flex items-center gap-2';
            }
        }
    });

    if (tabName === 'history') {
        renderHistoryList();
    }

    if (updateHash) {
        updateHashWithTab(tabName);
    }
}

/* -------------------------------------------------------------
    * サイドパネル（サイドバー）制御 & クイズセット管理
    * ------------------------------------------------------------- */
function toggleSidebar(forceState) {
    let sidebar = s('sidebar');
    let overlay = s('sidebarOverlay');
    
    if (typeof forceState === 'boolean') {
        isSidebarOpen = forceState;
    } else {
        isSidebarOpen = !isSidebarOpen;
    }

    if (isSidebarOpen) {
        sidebar.classList.remove('-translate-x-full');
        if (window.innerWidth < 768) overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }
}

function loadAllQuizSets(shouldUpdateHash = true) {
    let saved = localStorage.getItem('quiz_sets');
    if (saved) {
        try {
            quizSets = JSON.parse(saved);
        } catch(e) {
            console.error('保存されたクイズセットのパース失敗', e);
            quizSets = [];
        }
    }

    let updated = false;
    quizSets.forEach(set => {
        if (!set.randId || set.randId.length !== 6 || !/^[0-9a-fA-F]{6}$/.test(set.randId)) {
            set.randId = generate6DigitId();
            updated = true;
        }
        if (!set.status) {
            set.status = 'in_progress';
            updated = true;
        }
        if (!set.userAnswers) {
            set.userAnswers = {};
            updated = true;
        }
        if (typeof set.currentQuestionIdx !== 'number') {
            set.currentQuestionIdx = 0;
            updated = true;
        }
    });

    if (updated) {
        saveQuizSetsToStorage();
    }

    renderSidebarQuizList();

    // アクティブなクイズを選択（直近のもの）
    let lastActiveId = localStorage.getItem('current_quiz_id');
    if (lastActiveId) {
        let found = quizSets.find(q => q.id === lastActiveId);
        if (found) {
            selectQuizSet(found.id, false, shouldUpdateHash);
            return;
        }
    }

    if (quizSets.length > 0) {
        selectQuizSet(quizSets[0].id, false, shouldUpdateHash);
    } else {
        renderQuizPlayView();
    }
}

function saveQuizSetsToStorage() {
    localStorage.setItem('quiz_sets', JSON.stringify(quizSets, null, 4));
}

function renderSidebarQuizList() {
    let listContainer = s('sidebarQuizList');
    let searchQuery = (s('sidebarSearchInput')?.value || '').toLowerCase().trim();
    let sortType = s('sidebarSortSelect')?.value || 'created_desc';

    // 1. フィルタリング（検索）
    let filteredSets = quizSets.filter(set => {
        let topicMatch = set.topic && set.topic.toLowerCase().includes(searchQuery);
        let subjectMatch = set.subject && set.subject.toLowerCase().includes(searchQuery);
        let diffMatch = set.difficulty && set.difficulty.toLowerCase().includes(searchQuery);
        return topicMatch || subjectMatch || diffMatch;
    });

    // 2. ソート（並び替え）
    let diffMap = { '初級': 1, '中級': 2, '上級': 3 };
    filteredSets.sort((a, b) => {
        if (sortType === 'title_asc') {
            return (a.topic || '').localeCompare(b.topic || '', 'ja');
        } else if (sortType === 'title_desc') {
            return (b.topic || '').localeCompare(a.topic || '', 'ja');
        } else if (sortType === 'created_asc') {
            return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
        } else if (sortType === 'created_desc') {
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        } else if (sortType === 'length_asc') {
            return (a.questions.length || 0) - (b.questions.length || 0);
        } else if (sortType === 'length_desc') {
            return (b.questions.length || 0) - (a.questions.length || 0);
        } else if (sortType === 'difficulty') {
            return (diffMap[a.difficulty] || 0) - (diffMap[b.difficulty] || 0);
        } else if (sortType === 'status') {
            let statusNumA = Object.keys(a.userAnswers || {}).length / (a.questions.length || 1);
            let statusNumB = Object.keys(b.userAnswers || {}).length / (b.questions.length || 1);
            return (statusNumA || 0) - (statusNumB || 0);
        } else {
            return 0;
        }
    });

    s('savedSetCount').innerText = `${filteredSets.length}件`;

    if (filteredSets.length === 0) {
        listContainer.innerHTML = `
            <div class="text-center py-8 text-slate-400 dark:text-slate-500 text-xs">
                <i class="fa-solid fa-folder-open text-2xl mb-2 block"></i>
                <span>${searchQuery ? '該当するクイズがありません' : '保存されたクイズはありません'}</span>
            </div>`;
        return;
    }

    listContainer.innerHTML = '';
    filteredSets.forEach(set => {
        let isSelected = currentQuizData && currentQuizData.id === set.id;
        let card = document.createElement('div');
        card.className = `p-3 rounded-xl border transition cursor-pointer relative group ${
            isSelected
                ? 'border-blue-600 bg-blue-50/70 dark:bg-blue-950/40 text-blue-900 dark:text-blue-200 font-medium shadow-xs'
                : 'border-slate-200 dark:border-slate-700/70 hover:bg-slate-50 dark:hover:bg-slate-700/40 text-slate-700 dark:text-slate-300'
        }`;

        card.onclick = () => selectQuizSet(set.id, true);

        let dateStr = set.createdAt ? new Date(set.createdAt).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

        let statusBadge = set.status === 'completed'
            ? `<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300 text-[10px] font-bold">完了</span>`
            : `<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 dark:bg-amber-900/60 dark:text-amber-300 text-[10px] font-bold">途中</span>`;

        card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
                <h3 class="text-sm font-semibold flex-1 pr-6" title="${escapeHTML(set.topic)}">
                    ${escapeHTML(set.topic).trimCenter(15)}
                </h3>
                <button onclick="deleteQuizSet(event, '${set.id}')" title="削除" class="absolute top-2.5 right-2.5 p-1 text-slate-400 hover:text-red-500 rounded transition">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            </div>
            <div class="flex items-center gap-1.5 mt-2 text-xs text-slate-500 dark:text-slate-400 flex-wrap">
                ${statusBadge}
                <span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[10px] font-semibold">
                    ${escapeHTML(set.difficulty)}
                </span>
                <span>${set.questions ? set.questions.length : 0}問</span>
                <span class="ml-auto text-[10px] text-slate-400">${dateStr}</span>
            </div>
        `;
        listContainer.appendChild(card);
    });
}

function selectQuizSet(id, shouldSwitchTab = false, shouldUpdateHash = true) {
    let found = quizSets.find(q => q.id === id);
    if (!found) return;

    currentQuizData = found;
    localStorage.setItem('current_quiz_id', id);

    // 途中の解答状態と問題番号を復元
    userAnswers = found.userAnswers ? { ...found.userAnswers } : {};
    currentQuestionIdx = typeof found.currentQuestionIdx === 'number' ? found.currentQuestionIdx : 0;

    renderSidebarQuizList();
    renderQuizPlayView();
    s('playBadge').classList.remove('hidden');

    if (shouldSwitchTab) {
        switchTab('play');
        if (window.innerWidth < 768) {
            toggleSidebar(false);
        }
    } else if (shouldUpdateHash) {
        updateHashWithTab();
    }
}

function deleteQuizSet(e, id) {
    e.stopPropagation();
    
    quizSets = quizSets.filter(q => q.id !== id);
    saveQuizSetsToStorage();

    if (currentQuizData && currentQuizData.id === id) {
        currentQuizData = quizSets.length > 0 ? quizSets[0] : null;
        if (currentQuizData) {
            localStorage.setItem('current_quiz_id', currentQuizData.id);
        } else {
            localStorage.removeItem('current_quiz_id');
        }
    }

    renderSidebarQuizList();
    renderQuizPlayView();
    renderHistoryList();
    updateHashWithTab();
}

/* -------------------------------------------------------------
    * AIクイズ生成ロジック (askAI を活用)
    * ------------------------------------------------------------- */
async function handleGenerateQuiz(e) {
    e.preventDefault();

    let topic = s('topicInput').value.trim();
    let topic2 = s('topicInput2').value.trim();
    let count = s('countSelect').value;
    let type = s('typeSelect').value;
    let difficulty = s('difficultySelect').value;

    if (!topic) return;
    if (count < 1 || count > 20) count = 5;

    showLoading('AIがクイズを作成中...', '入力に合わせた最適な問題を生成しています');

    let systemPrompt = `あなたは優秀なクイズ作成AIです。指定された形式に従ってクイズを作成し、指定されたJSON構造のみを出力してください。Markdownのコードブロック(\`\`\`json ...)や解説テキストは含めず、純粋なJSON文字列のみを出力してください。なお、選択肢式の場合は、正解の選択肢を必ず入れてください。`;

    let userPrompt = `題名：${topic}
${topic2 ? `重点分野：${topic2}\n`: ''}
問題数：${count}問
難易度：${difficulty}
形式：${type === 'mixed' ? '選択式と記述式の混合' : (type === 'choice' ? '選択式のみ' : '記述式のみ')}

出力形式のJSONフォーマット：
[
    {
        "id": 1,
        "type": "choice" または "text",
        "question": "問題文",
        "options": ["選択肢1", "選択肢2", "選択肢3", "選択肢4"], // ※選択式の場合のみ必須
        "answer": "正解の選択肢の文章 または 記述の正解例・キーワード",
        "explanation": "問題の詳しい解説"
    }
]`;

    try {
        let rawReply = await askAI(systemPrompt, userPrompt);
        let cleanedJSON = cleanJSONString(rawReply);
        let quizArray = JSON.parse(cleanedJSON);

        if (!Array.isArray(quizArray) || quizArray.length === 0) {
            throw new Error('有効なクイズデータが生成されませんでした。');
        }

        let newQuizSet = {
            id: Date.now().toString(),
            randId: generate6DigitId(),
            topic: topic,
            subject: topic2,
            difficulty: difficulty,
            questions: quizArray,
            createdAt: new Date().toISOString(),
            status: 'in_progress', // 初期状態は「途中」
            userAnswers: {},
            currentQuestionIdx: 0
        };

        quizSets.unshift(newQuizSet);
        saveQuizSetsToStorage();

        hideLoading();
        selectQuizSet(newQuizSet.id, true);
    } catch (err) {
        console.error(err);
        hideLoading();
        alert(`クイズ生成に失敗しました：${err.message || '通信エラー'}`);
    }
}

function cleanJSONString(str) {
    let result = (str || '').trim();
    if (result.startsWith('```')) {
        result = result.replace(/^```[a-zA-Z]*\n?/, '').replace(/\n?```$/, '');
    }
    return result.trim();
}

function setTopicPreset(topicName, topicName2 = '') {
    s('topicInput').value = topicName;
    s('topicInput2').value = topicName2;
}

/* -------------------------------------------------------------
    * クイズ画面の描画・操作
    * ------------------------------------------------------------- */
function renderQuizPlayView() {
    if (!currentQuizData || !currentQuizData.questions) {
        s('noQuizAlert').classList.remove('hidden');
        s('quizContainer').classList.add('hidden');
        return;
    }

    s('noQuizAlert').classList.add('hidden');
    s('quizContainer').classList.remove('hidden');

    s('quizTopicBadge').innerText = `${currentQuizData.topic.trimCenter(15)}・${currentQuizData.difficulty}`;
    s('quizSubject').innerText = currentQuizData.subject ? currentQuizData.subject.trimCenter(15) : '（詳細未設定）';
    s('totalQNum').innerText = currentQuizData.questions.length;

    // 前回の進捗インデックスから再開
    if (currentQuestionIdx < 0 || currentQuestionIdx >= currentQuizData.questions.length) {
        currentQuestionIdx = 0;
    }

    displayQuestion(currentQuestionIdx);
}

function displayQuestion(idx) {
    let q = currentQuizData.questions[idx];
    s('currentQNum').innerText = idx + 1;
    s('questionText').innerText = q.question;

    // 進捗位置を保存
    currentQuizData.currentQuestionIdx = idx;
    saveQuizSetsToStorage();

    // 進捗バー
    let percent = ((idx + 1) / currentQuizData.questions.length) * 100;
    s('progressBar').style.width = `${percent}%`;

    // 問題形式バッジ
    let typeBadge = s('questionTypeBadge');
    if (q.type === 'choice') {
        typeBadge.innerText = '選択式 (4択)';
        typeBadge.className = 'inline-block px-2.5 py-0.5 text-xs font-semibold rounded bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 mb-2';
    } else {
        typeBadge.innerText = '記述式 (AI自動採点)';
        typeBadge.className = 'inline-block px-2.5 py-0.5 text-xs font-semibold rounded bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300 mb-2';
    }

    // 選択肢・記述入力の切替
    let optsContainer = s('optionsContainer');
    let textContainer = s('textInputContainer');

    if (q.type === 'choice') {
        optsContainer.classList.remove('hidden');
        textContainer.classList.add('hidden');
        optsContainer.innerHTML = '';

        q.options.forEach((optText, i) => {
            let isSelected = userAnswers[idx] === optText;
            let optBtn = document.createElement('button');
            optBtn.type = 'button';
            optBtn.className = `w-full text-left p-4 rounded-xl border transition flex items-center justify-between ${isSelected 
                    ? 'border-blue-600 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 font-semibold' 
                    : 'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50'
            }`;
            optBtn.onclick = () => selectChoice(idx, optText);
            optBtn.innerHTML = `
                <span>${'ABCD'[i]}. ${escapeHTML(optText)}</span>
                <div class="w-5 h-5 rounded-full border ${isSelected ? 'border-blue-600 bg-blue-600' : 'border-slate-300 dark:border-slate-600'} flex items-center justify-center">
                    ${isSelected ? '<i class="fa-solid fa-check text-white text-xs"></i>' : ''}
                </div>
            `;
            optsContainer.appendChild(optBtn);
        });
    } else {
        optsContainer.classList.add('hidden');
        textContainer.classList.remove('hidden');

        let textInput = s('textAnswerInput');
        textInput.value = userAnswers[idx] || '';
        textInput.oninput = (e) => {
            userAnswers[idx] = e.target.value;
            // 回答をリアルタイム保存
            if (currentQuizData) {
                currentQuizData.userAnswers = { ...userAnswers };
                saveQuizSetsToStorage();
            }
        };
    }

    // ボタン表示切り替え
    s('prevQBtn').disabled = (idx === 0);
    
    if (idx === currentQuizData.questions.length - 1) {
        s('nextQBtn').classList.add('hidden');
        s('submitQuizBtn').classList.remove('hidden');
    } else {
        s('nextQBtn').classList.remove('hidden');
        s('submitQuizBtn').classList.add('hidden');
    }
}

function selectChoice(qIdx, selectedText) {
    userAnswers[qIdx] = selectedText;
    if (currentQuizData) {
        currentQuizData.userAnswers = { ...userAnswers };
        saveQuizSetsToStorage();
    }
    displayQuestion(qIdx);
}

function navigateQuestion(direction) {
    let newIdx = currentQuestionIdx + direction;
    if (newIdx >= 0 && newIdx < currentQuizData.questions.length) {
        currentQuestionIdx = newIdx;
        displayQuestion(currentQuestionIdx);
    }
}

/* -------------------------------------------------------------
    * AI採点機能 (askAI)
    * ------------------------------------------------------------- */
async function submitAnswersAndGrade() {
    showLoading('AIが全問を採点中...', '選択肢の照合および記述回答の深層判定を行っています');

    let questions = currentQuizData.questions;
    let gradings = [];
    let totalPoints = 0;
    let pointsPerQ = 100 / questions.length;

    for (let i = 0; i < questions.length; i++) {
        let q = questions[i];
        let uAns = (userAnswers[i] || '').trim();

        if (q.type === 'choice') {
            let isCorrect = (uAns.toLowerCase() === (q.answer || '').toLowerCase());
            let score = isCorrect ? pointsPerQ : 0;
            totalPoints += score;

            gradings.push({
                qIndex: i + 1,
                question: q.question,
                type: 'choice',
                userAnswer: uAns || '(未回答)',
                correctAnswer: q.answer,
                isCorrect: isCorrect,
                score: Math.round(score),
                feedback: isCorrect ? '正解です！よく理解できています。' : '不正解です。解説を確認して復習しましょう。',
                explanation: q.explanation
            });
        } else {
            try {
                let gradeResult = await gradeTextAnswerWithAI(q.question, q.answer, uAns, pointsPerQ);
                totalPoints += gradeResult.score;
                gradings.push({
                    qIndex: i + 1,
                    question: q.question,
                    type: 'text',
                    userAnswer: uAns || '(未回答)',
                    correctAnswer: q.answer,
                    isCorrect: gradeResult.isCorrect,
                    score: Math.round(gradeResult.score),
                    feedback: gradeResult.feedback,
                    explanation: q.explanation
                });
            } catch (e) {
                console.error('記述採点エラー', e);
                gradings.push({
                    qIndex: i + 1,
                    question: q.question,
                    type: 'text',
                    userAnswer: uAns || '(未回答)',
                    correctAnswer: q.answer,
                    isCorrect: false,
                    score: 0,
                    feedback: '採点中にエラーが発生しました。',
                    explanation: q.explanation
                });
            }
        }
    }

    let finalScore = Math.min(100, Math.round(totalPoints));

    // ステータスを「完了」に更新して保存
    if (currentQuizData) {
        currentQuizData.status = 'completed';
        currentQuizData.lastScore = finalScore;
        saveQuizSetsToStorage();
        renderSidebarQuizList();
    }

    recordQuizCompletion();

    // 履歴への保存（クイズ実行セッションごとに保存）
    saveHistoryRecord({
        id: Date.now().toString(),
        quizSetId: currentQuizData.id,
        topic: currentQuizData.topic,
        subject: currentQuizData.subject,
        difficulty: currentQuizData.difficulty,
        date: new Date().toLocaleString('ja-JP'),
        score: finalScore,
        totalQuestions: questions.length,
        userAnswers: { ...userAnswers },
        details: gradings
    });

    hideLoading();
    showResultModal(finalScore, gradings);
}

async function gradeTextAnswerWithAI(question, modelAnswer, userAnswer, maxPoints) {
    if (!userAnswer) {
        return { score: 0, isCorrect: false, feedback: '回答が未記入です。' };
    }

    let sysPrompt = `あなたは公正で親切なクイズ採点AIです。問題と正解例に対してユーザーの回答を比較採点し、以下のJSON形式のみを出力してください。余計な文章やMarkdown枠は含めないでください。`;

    let userPrompt = `問題：${question}
解答例：${modelAnswer}
ユーザーの回答：${userAnswer}
配点満点：${maxPoints}点

出力JSONフォーマット：
{
    "score": 数値 (0 〜 ${maxPoints}),
    "isCorrect": true または false (部分点以上ならtrue),
    "feedback": "簡潔で具体的なフィードバック・アドバイス (1~2文)"
}`;

    let reply = await askAI(sysPrompt, userPrompt);
    let cleaned = cleanJSONString(reply);
    let parsed = JSON.parse(cleaned);

    return {
        score: (typeof parsed.score === 'number') ? parsed.score : 0,
        isCorrect: !!parsed.isCorrect,
        feedback: parsed.feedback || '判定が完了しました。'
    };
}

    else if (score >= 60) comment = '👍 合格ラインクリア！間違えた問題を復習しましょう。';
    else comment = '📚 伸びしろがたくさんあります！もう一度チャレンジしてみましょう。';

    s('resultComment').innerText = comment;

    let container = s('resultDetailsContainer');
    container.innerHTML = '';

    gradings.forEach(g => {
        let card = document.createElement('div');
        card.className = `p-4 rounded-xl border ${
            g.isCorrect 
                ? 'border-green-200 bg-green-50/50 dark:border-green-900/40 dark:bg-green-950/20' 
                : 'border-red-200 bg-red-50/50 dark:border-red-900/40 dark:bg-red-950/20'
        }`;

        card.innerHTML = `
            <div class="flex items-start justify-between gap-2 mb-2">
                <div class="flex items-center gap-2" style="width: calc(100% - 40px);">
                    <span class="w-6 h-6 rounded-full ${g.isCorrect ? 'bg-green-500' : 'bg-red-500'} text-white text-xs flex items-center justify-center font-bold">
                        Q${g.qIndex}
                    </span>

                <p class="text-slate-600 dark:text-slate-300"><span class="font-semibold">あなたの解答：</span> ${escapeHTML(g.userAnswer)}</p>
                <p class="text-slate-600 dark:text-slate-300"><span class="font-semibold">解答例/正解：</span> ${escapeHTML(g.correctAnswer)}</p>
                <p class="text-blue-600 dark:text-blue-400 font-medium mt-1"><i class="fa-solid fa-robot mr-1"></i> ${escapeHTML(g.feedback)}</p>

function closeResultModal() {
    s('resultModal').classList.add('hidden');
}

/* -------------------------------------------------------------
    * 連続学習日数 (Streak) ロジック
    * ------------------------------------------------------------- */
function initStreak() {
    let lastDateStr = localStorage.getItem('quiz_last_date');
    let streakCount = parseInt(localStorage.getItem('quiz_streak') || '0', 10);

    let todayStr = getTodayString();

    if (lastDateStr) {
        let diffDays = getDaysBetween(lastDateStr, todayStr);
        if (diffDays > 1) {
            streakCount = 0;
            localStorage.setItem('quiz_streak', '0');
        }
    }

    s('streakCountText').innerText = streakCount;
}

function recordQuizCompletion() {
    let lastDateStr = localStorage.getItem('quiz_last_date');
    let streakCount = parseInt(localStorage.getItem('quiz_streak') || '0', 10);
    let todayStr = getTodayString();

    if (lastDateStr !== todayStr) {
        if (!lastDateStr || getDaysBetween(lastDateStr, todayStr) === 1) {
            streakCount += 1;
        } else if (getDaysBetween(lastDateStr, todayStr) > 1) {
            streakCount = 1;
        }
        localStorage.setItem('quiz_last_date', todayStr);
        localStorage.setItem('quiz_streak', streakCount.toString());
    }

    s('streakCountText').innerText = streakCount;
}

function getTodayString() {
    let now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
}

function getDaysBetween(dateStr1, dateStr2) {
    let d1 = new Date(dateStr1);
    let d2 = new Date(dateStr2);
    let diffTime = Math.abs(d2 - d1);
    return Math.floor(diffTime / (1000 * 60 * 60 * 24));
}

/* -------------------------------------------------------------
    * 履歴データの保存 & レンダリング（quiz_historyのセッション分岐化）
    * ------------------------------------------------------------- */
function saveHistoryRecord(record) {
    let history = JSON.parse(localStorage.getItem('quiz_history') || '[]');
    history.unshift(record);
    localStorage.setItem('quiz_history', JSON.stringify(history, null, 4));
}

function renderHistoryList() {
    let listContainer = s('historyList');
    let historyLogs = JSON.parse(localStorage.getItem('quiz_history') || '[]');

    if (quizSets.length === 0 && historyLogs.length === 0) {
        listContainer.innerHTML = `
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-10 text-center border border-slate-200 dark:border-slate-700">
                <i class="fa-solid fa-clock text-3xl text-slate-300 dark:text-slate-600 mb-2"></i>
                <p class="text-slate-500 dark:text-slate-400 text-sm">クイズの解答履歴や学習記録はまだありません。</p>
            </div>`;
        return;
    }

    listContainer.innerHTML = '';

    // クイズセットごとに履歴ログをグループ化
    let setHistoryMap = {};
    historyLogs.forEach(log => {
        let sid = log.quizSetId || 'unknown';
        if (!setHistoryMap[sid]) {
            setHistoryMap[sid] = [];
        }
        setHistoryMap[sid].push(log);
    });

    // 表示用の対象セット一覧を作成（quizSetsに含まれない削除済みデータも履歴があれば抽出）
    let displayMap = new Map();

    quizSets.forEach(set => {
        displayMap.set(set.id, {
            id: set.id,
            topic: set.topic,
            subject: set.subject,
            difficulty: set.difficulty,
            questionsCount: set.questions ? set.questions.length : 0,
            status: set.status,
            createdAt: set.createdAt,
            logs: setHistoryMap[set.id] || []
        });
    });

    // quizSetsから削除されたが履歴だけ残っているクイズも救出
    Object.keys(setHistoryMap).forEach(sid => {
        if (!displayMap.has(sid) && setHistoryMap[sid].length > 0) {
            let firstLog = setHistoryMap[sid][0];
            displayMap.set(sid, {
                id: sid,
                topic: firstLog.topic || '削除されたクイズ',
                subject: firstLog.subject || '',
                difficulty: firstLog.difficulty || '不明',
                questionsCount: firstLog.totalQuestions || 0,
                status: 'completed',
                createdAt: firstLog.date || '',
                logs: setHistoryMap[sid]
            });
        }
    });

    displayMap.forEach((item) => {
        let card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4';

        let hasLogs = item.logs.length > 0;
        let latestLog = hasLogs ? item.logs[0] : null;
        let isCompleted = item.status === 'completed' || hasLogs;

        let badgeHTML = isCompleted
            ? `<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300 text-xs font-bold inline-flex items-center gap-1">
                <i class="fa-solid fa-check"></i>
                <span>完了 (${item.logs.length}回)</span>
            </span>`
            : `<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/60 dark:text-amber-300 text-xs font-bold inline-flex items-center gap-1">
                <i class="fa-solid fa-hourglass-half"></i>
                <span>途中</span>
            </span>`;

        let headerHTML = `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-700/60 pb-3">
                <div class="space-y-1.5 flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                        ${badgeHTML}
                        <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 font-semibold">
                            ${escapeHTML(item.topic)}
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400">
                        問題数：${item.questionsCount}問 ／ 難易度：${escapeHTML(item.difficulty)}
                    </p>
                </div>
                <div class="flex items-center gap-2 self-start sm:self-center">
                    <button onclick="selectQuizSet('${item.id}', true)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-play"></i>
                        <span>${hasLogs ? 'もう一度解く' : 'クイズを開始'}</span>
                    </button>
                </div>
            </div>
        `;

        // 個別のセッション履歴（回ごとのログ）アコーディオン／リスト構築
        let logsHTML = '';
        if (hasLogs) {
            let logRows = item.logs.map((log, index) => {
                let attemptNum = item.logs.length - index;
                return `
                    <div class="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-3 flex items-center justify-between gap-3 text-xs border border-slate-100 dark:border-slate-700/40">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-slate-500 dark:text-slate-400 w-12 shrink-0">${attemptNum}.</span>
                            <span class="text-slate-400">${escapeHTML(log.date)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-sm ${log.score >= 80 ? 'text-green-600 dark:text-green-400' : (log.score >= 60 ? 'text-blue-600 dark:text-blue-400' : 'text-amber-600 dark:text-amber-400')}">
                                ${log.score} 点
                            </span>
                            <button onclick="viewHistoryDetail('${log.id}')" class="px-2.5 py-1 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition font-medium">
                                結果詳細
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            logsHTML = `
                <div class="space-y-2 pt-1">
                    <div class="text-xs font-bold text-slate-500 dark:text-slate-400 flex items-center gap-1.5 mb-2">
                        <i class="fa-solid fa-list-check"></i>
                        <span>解答履歴（全${item.logs.length}回）</span>
                    </div>
                    <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        ${logRows}
                    </div>
                </div>
            `;
        } else {
            logsHTML = `
                <div class="text-xs text-slate-400 dark:text-slate-500 py-1 italic">
                    まだ採点済みの履歴はありません。
                </div>
            `;
        }

        card.innerHTML = headerHTML + logsHTML;
        listContainer.appendChild(card);
    });
}

function viewHistoryDetail(logId) {
    let historyLogs = JSON.parse(localStorage.getItem('quiz_history') || '[]');
    let log = historyLogs.find(l => l.id === logId);
    if (!log) {
        alert('該当する解答詳細が見つかりませんでした。');
        return;
    }
    showResultModal(log.score, log.details || []);
}

function clearHistory() {
    if (confirm('保存されているクイズ履歴をすべて削除しますか？')) {
        localStorage.removeItem('quiz_sets');
        localStorage.removeItem('quiz_history');
        localStorage.removeItem('current_quiz_id');
        quizSets = [];
        currentQuizData = null;
        userAnswers = {};
        currentQuestionIdx = 0;
        renderSidebarQuizList();
        renderQuizPlayView();
        renderHistoryList();
    }
}

/* -------------------------------------------------------------
    * ユーティリティ・ローディング・UI装飾
    * ------------------------------------------------------------- */
function showLoading(title, subtitle) {
    s('loadingTitle').innerText = title || 'AIが処理中...';
    s('loadingSubtitle').innerText = subtitle || 'しばらくお待ちください';
    s('loadingModal').classList.remove('hidden');
}

function hideLoading() {
    s('loadingModal').classList.add('hidden');
}

function setupTheme() {
    let toggleBtn = s('themeToggleBtn');
    let icon = s('themeIcon');

    if (localStorage.getItem('quiz_color_theme') === 'dark' || (!('quiz_color_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        icon.className = 'fa-solid fa-sun text-lg text-amber-400';
    } else {
        document.documentElement.classList.remove('dark');
        icon.className = 'fa-solid fa-moon text-lg text-slate-600';
    }

    toggleBtn.onclick = () => {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('quiz_color_theme', 'light');
            icon.className = 'fa-solid fa-moon text-lg text-slate-600';
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('quiz_color_theme', 'dark');
            icon.className = 'fa-solid fa-sun text-lg text-amber-400';
        }
    };
}

function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
    );
}
